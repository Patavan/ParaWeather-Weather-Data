name: ParaWeather ICON-D2 Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  icon-d2:
    runs-on: ubuntu-latest

    steps:
      - name: Werkzeuge installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeccodes-tools bzip2 sshpass

      - name: Neuesten vollständigen ICON-D2 Lauf finden
        id: detect
        run: |
          python3 <<'PY'
          import urllib.request
          import os
          from datetime import datetime, timezone, timedelta

          now = datetime.now(timezone.utc)
          base_hour = (now.hour // 3) * 3
          base = now.replace(hour=base_hour, minute=0, second=0, microsecond=0)

          surface_fields = [
              "u_10m", "v_10m", "t_2m", "vmax_10m",
              "tot_prec", "clct", "pmsl"
          ]
          upper_levels = [60, 61, 62, 63, 64, 65]

          def exists(url):
              try:
                  req = urllib.request.Request(url, method="HEAD")
                  with urllib.request.urlopen(req, timeout=15) as r:
                      return r.status == 200
              except Exception:
                  return False

          found = None
          for back in range(0, 24, 3):
              run = base - timedelta(hours=back)
              date = run.strftime("%Y%m%d")
              hour = run.strftime("%H")
              run_id = f"{date}{hour}"
              root = f"https://opendata.dwd.de/weather/nwp/icon-d2/grib/{hour}"

              print("Prüfe ICON-D2 Lauf:", run_id)
              complete = True

              for field in surface_fields:
                  url = (
                      f"{root}/{field}/"
                      f"icon-d2_germany_regular-lat-lon_single-level_"
                      f"{run_id}_024_2d_{field}.grib2.bz2"
                  )
                  if not exists(url):
                      print("Fehlt:", url)
                      complete = False
                      break

              if not complete:
                  continue

              for level in upper_levels:
                  for component in ("u", "v"):
                      url = (
                          f"{root}/{component}/"
                          f"icon-d2_germany_icosahedral_model-level_"
                          f"{run_id}_024_{level}_{component}.grib2.bz2"
                      )
                      if not exists(url):
                          print("Höhenwind fehlt:", url)
                          complete = False
                          break
                  if not complete:
                      break

              if complete:
                  found = (date, hour, run_id)
                  break

          if found is None:
              raise RuntimeError("Kein vollständiger ICON-D2 Lauf gefunden")

          date, hour, run_id = found
          print("Verwendeter ICON-D2 Lauf:", run_id)

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"date={date}\n")
              out.write(f"hour={hour}\n")
              out.write(f"run_id={run_id}\n")
          PY

      - name: Prüfen ob Lauf bereits verarbeitet wurde
        id: changed
        run: |
          CURRENT_RUN="${{ steps.detect.outputs.run_id }}"
          REMOTE_RUN=$(curl -fsS \
            "https://www.orend.org/paraweather-data/icon-d2-tiles-run.txt" \
            2>/dev/null || true)

          echo "DWD Lauf:    $CURRENT_RUN"
          echo "STRATO Lauf: $REMOTE_RUN"

          if [ "$CURRENT_RUN" = "$REMOTE_RUN" ]; then
            echo "new_data=false" >> "$GITHUB_OUTPUT"
          else
            echo "new_data=true" >> "$GITHUB_OUTPUT"
          fi

      - name: ICON-D2 Bodenwetter 0-24h laden
        if: steps.changed.outputs.new_data == 'true'
        run: |
          set -euo pipefail
          HOUR="${{ steps.detect.outputs.hour }}"
          RUN="${{ steps.detect.outputs.run_id }}"
          BASE="https://opendata.dwd.de/weather/nwp/icon-d2/grib/${HOUR}"

          mkdir -p grib/surface
          FIELDS="u_10m v_10m t_2m vmax_10m tot_prec clct pmsl"

          for STEP in $(seq 0 24); do
            FSTEP=$(printf "%03d" "$STEP")
            echo "Bodenwetter +${FSTEP}h"

            for FIELD in $FIELDS; do
              URL="$BASE/$FIELD/icon-d2_germany_regular-lat-lon_single-level_${RUN}_${FSTEP}_2d_${FIELD}.grib2.bz2"
              TARGET="grib/surface/${FIELD}_${FSTEP}.grib2.bz2"

              curl --fail --location \
                --retry 3 --retry-delay 2 --retry-all-errors \
                "$URL" -o "$TARGET"

              bunzip2 "$TARGET"
            done
          done

      - name: ICON-D2 Höhenwind-Dateien laden
        if: steps.changed.outputs.new_data == 'true'
        run: |
          set -euo pipefail
          HOUR="${{ steps.detect.outputs.hour }}"
          RUN="${{ steps.detect.outputs.run_id }}"
          BASE="https://opendata.dwd.de/weather/nwp/icon-d2/grib/${HOUR}"

          mkdir -p grib/upper
          LEVELS="60 61 62 63 64 65"

          for STEP in $(seq 0 24); do
            FSTEP=$(printf "%03d" "$STEP")
            echo "Höhenwind +${FSTEP}h"

            for LEVEL in $LEVELS; do
              for COMPONENT in u v; do
                URL="$BASE/$COMPONENT/icon-d2_germany_icosahedral_model-level_${RUN}_${FSTEP}_${LEVEL}_${COMPONENT}.grib2.bz2"
                TARGET="grib/upper/${COMPONENT}_${FSTEP}_${LEVEL}.grib2.bz2"

                curl --fail --location \
                  --retry 3 --retry-delay 2 --retry-all-errors \
                  "$URL" -o "$TARGET"

                bunzip2 "$TARGET"
              done
            done
          done

      - name: ICON-D2 Boden-Kacheln erzeugen
        if: steps.changed.outputs.new_data == 'true'
        run: |
          python3 <<'PY'
          import subprocess
          import json
          import math
          import os
          from datetime import datetime, timezone, timedelta

          RUN_ID = "${{ steps.detect.outputs.run_id }}"
          run_time = datetime.strptime(RUN_ID, "%Y%m%d%H").replace(tzinfo=timezone.utc)
          os.makedirs("surface-tiles", exist_ok=True)

          def read_map(path):
              output = subprocess.check_output(
                  ["grib_get_data", path],
                  text=True,
                  stderr=subprocess.STDOUT
              )
              values = {}
              for line in output.splitlines():
                  parts = line.split()
                  if len(parts) < 3:
                      continue
                  try:
                      lat = float(parts[0])
                      lon = float(parts[1])
                      value = float(parts[-1])
                  except ValueError:
                      continue
                  key = (round(lat, 6), round(lon, 6))
                  values[key] = (lat, lon, value)

              if not values:
                  raise RuntimeError("Keine Rasterdaten aus " + path)
              return values

          def tile_name(lat, lon):
              lat_floor = math.floor(lat)
              lon_floor = math.floor(lon)
              return (
                  f"{'N' if lat_floor >= 0 else 'S'}{abs(lat_floor):02d}_"
                  f"{'E' if lon_floor >= 0 else 'W'}{abs(lon_floor):03d}"
              )

          sampling_step = 10
          tiles = {}

          for forecast_hour in range(25):
              fstep = f"{forecast_hour:03d}"
              print("Verarbeite Boden +", fstep, "h")

              fields = {
                  "u": read_map(f"grib/surface/u_10m_{fstep}.grib2"),
                  "v": read_map(f"grib/surface/v_10m_{fstep}.grib2"),
                  "t": read_map(f"grib/surface/t_2m_{fstep}.grib2"),
                  "gust": read_map(f"grib/surface/vmax_10m_{fstep}.grib2"),
                  "precip": read_map(f"grib/surface/tot_prec_{fstep}.grib2"),
                  "cloud": read_map(f"grib/surface/clct_{fstep}.grib2"),
                  "pressure": read_map(f"grib/surface/pmsl_{fstep}.grib2"),
              }

              common = set.intersection(*(set(m.keys()) for m in fields.values()))
              if not common:
                  raise RuntimeError(f"Keine gemeinsamen Boden-Rasterpunkte bei +{fstep}h")

              # Stabile geografische Reihenfolge statt positionsabhängiger Arrays.
              common = sorted(common)
              print(
                  "Rasterpunkte:",
                  {name: len(data) for name, data in fields.items()},
                  "gemeinsam:", len(common)
              )

              valid_time = (
                  run_time + timedelta(hours=forecast_hour)
              ).isoformat()

              for idx, key in enumerate(common):
                  if idx % sampling_step != 0:
                      continue

                  lat, lon, u = fields["u"][key]
                  _, _, v = fields["v"][key]
                  _, _, temp_k = fields["t"][key]
                  _, _, gust_ms = fields["gust"][key]
                  _, _, precip = fields["precip"][key]
                  _, _, cloud = fields["cloud"][key]
                  _, _, pressure_pa = fields["pressure"][key]

                  tile = tile_name(lat, lon)
                  point_key = f"{round(lat,4)},{round(lon,4)}"

                  tiles.setdefault(tile, {})
                  tiles[tile].setdefault(
                      point_key,
                      {
                          "lat": round(lat, 4),
                          "lon": round(lon, 4),
                          "forecast": []
                      }
                  )

                  wind_ms = math.hypot(u, v)
                  direction = (math.degrees(math.atan2(-u, -v)) + 360) % 360

                  tiles[tile][point_key]["forecast"].append({
                      "hour": forecast_hour,
                      "valid_time": valid_time,
                      "temperature_c": round(temp_k - 273.15, 1),
                      "wind_speed_kmh": round(wind_ms * 3.6, 1),
                      "wind_direction_deg": round(direction),
                      "wind_gust_kmh": round(gust_ms * 3.6, 1),
                      "precipitation_mm": round(max(precip, 0.0), 2),
                      "cloud_cover_percent": round(max(0.0, min(100.0, cloud)), 1),
                      "pressure_msl_hpa": round(pressure_pa / 100.0, 1)
                  })

          generated_at = datetime.now(timezone.utc).isoformat()
          tile_names = []
          total_points = 0

          for tile, point_map in tiles.items():
              tile_names.append(tile)
              points = list(point_map.values())
              total_points += len(points)

              output = {
                  "status": "ok",
                  "source": "DWD Open Data",
                  "model": "ICON-D2",
                  "model_run": RUN_ID,
                  "tile": tile,
                  "grid": "regular-lat-lon",
                  "forecast_hours": 24,
                  "forecast_interval_hours": 1,
                  "generated_at": generated_at,
                  "attribution": "Deutscher Wetterdienst (DWD)",
                  "sampling_step": sampling_step,
                  "parameters": [
                      "temperature_c",
                      "wind_speed_kmh",
                      "wind_direction_deg",
                      "wind_gust_kmh",
                      "precipitation_mm",
                      "cloud_cover_percent",
                      "pressure_msl_hpa"
                  ],
                  "points": points
              }

              with open(
                  f"surface-tiles/{tile}.json",
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(output, f, separators=(",", ":"), ensure_ascii=False)

          index = {
              "status": "ok",
              "source": "DWD Open Data",
              "model": "ICON-D2",
              "model_run": RUN_ID,
              "dataset": "surface",
              "grid": "regular-lat-lon",
              "generated_at": generated_at,
              "tile_count": len(tile_names),
              "total_points": total_points,
              "forecast_hours": 24,
              "forecast_interval_hours": 1,
              "sampling_step": sampling_step,
              "attribution": "Deutscher Wetterdienst (DWD)",
              "tiles": sorted(tile_names)
          }

          with open("icon-d2-index.json", "w", encoding="utf-8") as f:
              json.dump(index, f, separators=(",", ":"), ensure_ascii=False)

          print("Boden-Kacheln:", len(tile_names))
          print("Boden-Rasterpunkte:", total_points)
          PY

      - name: ICON-D2 Höhenwind-Kacheln erzeugen
        if: steps.changed.outputs.new_data == 'true'
        run: |
          python3 <<'PY'
          import subprocess
          import json
          import math
          import os
          from datetime import datetime, timezone, timedelta

          RUN_ID = "${{ steps.detect.outputs.run_id }}"
          MODEL_LEVELS = [60, 61, 62, 63, 64, 65]
          run_time = datetime.strptime(RUN_ID, "%Y%m%d%H").replace(tzinfo=timezone.utc)
          os.makedirs("upper-tiles", exist_ok=True)

          def read_map(path):
              output = subprocess.check_output(
                  ["grib_get_data", path],
                  text=True,
                  stderr=subprocess.STDOUT
              )
              values = {}
              for line in output.splitlines():
                  parts = line.split()
                  if len(parts) < 3:
                      continue
                  try:
                      lat = float(parts[0])
                      lon = float(parts[1])
                      value = float(parts[-1])
                  except ValueError:
                      continue
                  values[(round(lat, 6), round(lon, 6))] = (lat, lon, value)

              if not values:
                  raise RuntimeError("Keine Höhenwinddaten aus " + path)
              return values

          def tile_name(lat, lon):
              lat_floor = math.floor(lat)
              lon_floor = math.floor(lon)
              return (
                  f"{'N' if lat_floor >= 0 else 'S'}{abs(lat_floor):02d}_"
                  f"{'E' if lon_floor >= 0 else 'W'}{abs(lon_floor):03d}"
              )

          spatial_step_deg = 0.1
          tiles = {}

          for forecast_hour in range(25):
              fstep = f"{forecast_hour:03d}"
              print("Verarbeite Höhenwind +", fstep, "h")
              valid_time = (run_time + timedelta(hours=forecast_hour)).isoformat()

              hour_points = {}
              selected_keys = None

              for level in MODEL_LEVELS:
                  u_map = read_map(f"grib/upper/u_{fstep}_{level}.grib2")
                  v_map = read_map(f"grib/upper/v_{fstep}_{level}.grib2")
                  common = set(u_map) & set(v_map)

                  if not common:
                      raise RuntimeError(
                          f"Keine gemeinsamen U/V-Punkte Level {level} +{fstep}h"
                      )

                  if selected_keys is None:
                      seen_cells = set()
                      selected_keys = []
                      for key in sorted(common):
                          lat, lon, _ = u_map[key]
                          cell = (
                              round(lat / spatial_step_deg),
                              round(lon / spatial_step_deg)
                          )
                          if cell in seen_cells:
                              continue
                          seen_cells.add(cell)
                          selected_keys.append(key)

                  for key in selected_keys:
                      if key not in u_map or key not in v_map:
                          continue

                      lat, lon, u = u_map[key]
                      _, _, v = v_map[key]
                      point_key = f"{round(lat,4)},{round(lon,4)}"

                      hour_points.setdefault(
                          point_key,
                          {
                              "lat": round(lat, 4),
                              "lon": round(lon, 4),
                              "levels": []
                          }
                      )

                      speed_ms = math.hypot(u, v)
                      direction = (math.degrees(math.atan2(-u, -v)) + 360) % 360

                      hour_points[point_key]["levels"].append({
                          "type": "model_level",
                          "level": level,
                          "wind_speed_kmh": round(speed_ms * 3.6, 1),
                          "wind_direction_deg": round(direction)
                      })

              for point_key, point in hour_points.items():
                  tile = tile_name(point["lat"], point["lon"])
                  tiles.setdefault(tile, {})
                  tiles[tile].setdefault(
                      point_key,
                      {
                          "lat": point["lat"],
                          "lon": point["lon"],
                          "forecast": []
                      }
                  )
                  tiles[tile][point_key]["forecast"].append({
                      "hour": forecast_hour,
                      "valid_time": valid_time,
                      "levels": point["levels"]
                  })

          generated_at = datetime.now(timezone.utc).isoformat()
          tile_names = []
          total_points = 0

          for tile, point_map in tiles.items():
              tile_names.append(tile)
              points = list(point_map.values())
              total_points += len(points)

              output = {
                  "status": "ok",
                  "source": "DWD Open Data",
                  "model": "ICON-D2",
                  "model_run": RUN_ID,
                  "dataset": "upper_air",
                  "tile": tile,
                  "grid": "icosahedral",
                  "vertical_coordinate": "model_level",
                  "model_levels": MODEL_LEVELS,
                  "forecast_hours": 24,
                  "forecast_interval_hours": 1,
                  "spatial_sampling_deg": spatial_step_deg,
                  "generated_at": generated_at,
                  "attribution": "Deutscher Wetterdienst (DWD)",
                  "points": points
              }

              with open(
                  f"upper-tiles/{tile}.json",
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(output, f, separators=(",", ":"), ensure_ascii=False)

          index = {
              "status": "ok",
              "source": "DWD Open Data",
              "model": "ICON-D2",
              "model_run": RUN_ID,
              "dataset": "upper_air",
              "grid": "icosahedral",
              "vertical_coordinate": "model_level",
              "model_levels": MODEL_LEVELS,
              "generated_at": generated_at,
              "tile_count": len(tile_names),
              "total_points": total_points,
              "forecast_hours": 24,
              "forecast_interval_hours": 1,
              "spatial_sampling_deg": spatial_step_deg,
              "attribution": "Deutscher Wetterdienst (DWD)",
              "tiles": sorted(tile_names)
          }

          with open("icon-d2-upper-index.json", "w", encoding="utf-8") as f:
              json.dump(index, f, separators=(",", ":"), ensure_ascii=False)

          print("Höhenwind-Kacheln:", len(tile_names))
          print("Höhenwindpunkte:", total_points)
          PY

      - name: ICON-D2 Archive erstellen
        if: steps.changed.outputs.new_data == 'true'
        run: |
          tar -czf icon-d2-tiles.tar.gz surface-tiles
          tar -czf icon-d2-upper-tiles.tar.gz upper-tiles

      - name: ICON-D2 Laufmarker erzeugen
        if: steps.changed.outputs.new_data == 'true'
        run: |
          echo -n "${{ steps.detect.outputs.run_id }}" > icon-d2-tiles-run.txt

      - name: ICON-D2 zu STRATO übertragen
        if: steps.changed.outputs.new_data == 'true'
        env:
          SSHPASS: ${{ secrets.STRATO_PASSWORD }}
        run: |
          set -euo pipefail

          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            "${{ secrets.STRATO_USER }}@${{ secrets.STRATO_HOST }}" \
            "mkdir -p Orend/paraweather-data"

          for FILE in \
            icon-d2-tiles.tar.gz \
            icon-d2-upper-tiles.tar.gz \
            icon-d2-index.json \
            icon-d2-upper-index.json
          do
            sshpass -e scp \
              -o StrictHostKeyChecking=no \
              "$FILE" \
              "${{ secrets.STRATO_USER }}@${{ secrets.STRATO_HOST }}:Orend/paraweather-data/$FILE"
          done

          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            "${{ secrets.STRATO_USER }}@${{ secrets.STRATO_HOST }}" \
            '
            set -e
            cd Orend/paraweather-data

            rm -rf icon-d2-tiles-new icon-d2-upper-tiles-new
            mkdir icon-d2-tiles-new icon-d2-upper-tiles-new

            tar -xzf icon-d2-tiles.tar.gz \
              -C icon-d2-tiles-new --strip-components=1

            tar -xzf icon-d2-upper-tiles.tar.gz \
              -C icon-d2-upper-tiles-new --strip-components=1

            rm -rf icon-d2-tiles-old icon-d2-upper-tiles-old

            if [ -d icon-d2-tiles ]; then
              mv icon-d2-tiles icon-d2-tiles-old
            fi

            if [ -d icon-d2-upper-tiles ]; then
              mv icon-d2-upper-tiles icon-d2-upper-tiles-old
            fi

            mv icon-d2-tiles-new icon-d2-tiles
            mv icon-d2-upper-tiles-new icon-d2-upper-tiles

            rm -rf icon-d2-tiles-old icon-d2-upper-tiles-old
            rm -f icon-d2-tiles.tar.gz icon-d2-upper-tiles.tar.gz
            '

          # Laufmarker erst ganz zum Schluss: nur vollständig erfolgreiche Läufe gelten als aktuell.
          sshpass -e scp \
            -o StrictHostKeyChecking=no \
            icon-d2-tiles-run.txt \
            "${{ secrets.STRATO_USER }}@${{ secrets.STRATO_HOST }}:Orend/paraweather-data/icon-d2-tiles-run.txt"

          echo "ICON-D2 erfolgreich aktualisiert."

      - name: Kein neuer ICON-D2 Lauf
        if: steps.changed.outputs.new_data == 'false'
        run: |
          echo "ICON-D2 ist bereits aktuell."
          echo "Kein STRATO-Upload notwendig."
