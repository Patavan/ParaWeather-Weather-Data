name: ParaWeather ICON-D2 Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  icon-d2:
    runs-on: ubuntu-latest

    steps:
      - name: Werkzeuge installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeccodes-tools bzip2 sshpass

      - name: Neuesten verfügbaren ICON-D2 Lauf finden
        id: detect
        run: |
          python3 <<'PY'
          import urllib.request
          from datetime import datetime, timezone, timedelta
          import os

          now = datetime.now(timezone.utc)

          base_hour = (now.hour // 3) * 3
          base = now.replace(
              hour=base_hour,
              minute=0,
              second=0,
              microsecond=0
          )

          found = None

          for back in range(0, 24, 3):
              run = base - timedelta(hours=back)

              date = run.strftime("%Y%m%d")
              hour = run.strftime("%H")

              base_url = (
                  f"https://opendata.dwd.de/weather/nwp/"
                  f"icon-d2/grib/{hour}"
              )

              # Wir prüfen Forecast 024 gleich mit.
              # Damit wird nur ein Lauf verwendet,
              # dessen 24-h-Daten bereits verfügbar sind.
              files = [
                  f"{base_url}/u_10m/"
                  f"icon-d2_germany_regular-lat-lon_single-level_"
                  f"{date}{hour}_024_2d_u_10m.grib2.bz2",

                  f"{base_url}/v_10m/"
                  f"icon-d2_germany_regular-lat-lon_single-level_"
                  f"{date}{hour}_024_2d_v_10m.grib2.bz2",

                  f"{base_url}/t_2m/"
                  f"icon-d2_germany_regular-lat-lon_single-level_"
                  f"{date}{hour}_024_2d_t_2m.grib2.bz2"
              ]

              ok = True

              for url in files:
                  try:
                      request = urllib.request.Request(
                          url,
                          method="HEAD"
                      )

                      with urllib.request.urlopen(
                          request,
                          timeout=15
                      ) as response:
                          if response.status != 200:
                              ok = False
                              break

                  except Exception:
                      ok = False
                      break

              if ok:
                  found = (date, hour)
                  break

          if found is None:
              raise RuntimeError(
                  "Kein vollständiger ICON-D2 24h-Lauf gefunden"
              )

          date, hour = found
          run_id = f"{date}{hour}"

          print("Gefundener ICON-D2 Lauf:", run_id)

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a"
          ) as output:
              output.write(f"date={date}\n")
              output.write(f"hour={hour}\n")
              output.write(f"run_id={run_id}\n")
          PY

      - name: Prüfen ob Lauf bereits verarbeitet wurde
        id: changed
        run: |
          CURRENT_RUN="${{ steps.detect.outputs.run_id }}"

          REMOTE_RUN=$(
            curl -fsS \
            "https://www.orend.org/paraweather-data/icon-d2-24h-run.txt" \
            2>/dev/null || true
          )

          echo "DWD Lauf: $CURRENT_RUN"
          echo "STRATO 24h Lauf: $REMOTE_RUN"

          if [ "$CURRENT_RUN" = "$REMOTE_RUN" ]; then
            echo "Kein neuer Modelllauf."
            echo "new_data=false" >> "$GITHUB_OUTPUT"
          else
            echo "Neuer Modelllauf vorhanden."
            echo "new_data=true" >> "$GITHUB_OUTPUT"
          fi

      - name: ICON-D2 Daten 0-24h laden
        if: steps.changed.outputs.new_data == 'true'
        run: |
          HOUR="${{ steps.detect.outputs.hour }}"
          RUN="${{ steps.detect.outputs.run_id }}"

          BASE="https://opendata.dwd.de/weather/nwp/icon-d2/grib/${HOUR}"

          mkdir -p grib

          for STEP in $(seq 0 24); do
            FSTEP=$(printf "%03d" "$STEP")

            echo "Lade ICON-D2 ${RUN} +${FSTEP}h"

            curl -fL \
              "$BASE/u_10m/icon-d2_germany_regular-lat-lon_single-level_${RUN}_${FSTEP}_2d_u_10m.grib2.bz2" \
              -o "grib/u_${FSTEP}.grib2.bz2"

            curl -fL \
              "$BASE/v_10m/icon-d2_germany_regular-lat-lon_single-level_${RUN}_${FSTEP}_2d_v_10m.grib2.bz2" \
              -o "grib/v_${FSTEP}.grib2.bz2"

            curl -fL \
              "$BASE/t_2m/icon-d2_germany_regular-lat-lon_single-level_${RUN}_${FSTEP}_2d_t_2m.grib2.bz2" \
              -o "grib/t_${FSTEP}.grib2.bz2"

            bunzip2 "grib/u_${FSTEP}.grib2.bz2"
            bunzip2 "grib/v_${FSTEP}.grib2.bz2"
            bunzip2 "grib/t_${FSTEP}.grib2.bz2"
          done

      - name: ICON-D2 0-24h Raster erzeugen
        if: steps.changed.outputs.new_data == 'true'
        run: |
          python3 <<'PY'
          import subprocess
          import json
          import math
          from datetime import datetime, timezone, timedelta

          RUN_ID = "${{ steps.detect.outputs.run_id }}"

          run_time = datetime.strptime(
              RUN_ID,
              "%Y%m%d%H"
          ).replace(tzinfo=timezone.utc)

          def read_values(path):
              output = subprocess.check_output(
                  ["grib_get_data", path],
                  text=True,
                  stderr=subprocess.STDOUT
              )

              rows = []

              for line in output.splitlines():
                  parts = line.split()

                  if len(parts) < 3:
                      continue

                  try:
                      lat = float(parts[0])
                      lon = float(parts[1])
                      value = float(parts[-1])
                  except ValueError:
                      continue

                  rows.append((lat, lon, value))

              if not rows:
                  raise RuntimeError(
                      f"Keine Rasterdaten aus {path} gelesen"
                  )

              return rows

          sampling_step = 10

          points = None

          for forecast_hour in range(0, 25):
              fstep = f"{forecast_hour:03d}"

              print(
                  f"Verarbeite Forecast +{fstep}h"
              )

              u_rows = read_values(
                  f"grib/u_{fstep}.grib2"
              )

              v_rows = read_values(
                  f"grib/v_{fstep}.grib2"
              )

              t_rows = read_values(
                  f"grib/t_{fstep}.grib2"
              )

              if not (
                  len(u_rows) ==
                  len(v_rows) ==
                  len(t_rows)
              ):
                  raise RuntimeError(
                      f"Rastergrößen bei +{fstep}h stimmen nicht überein"
                  )

              valid_time = (
                  run_time +
                  timedelta(hours=forecast_hour)
              ).isoformat()

              if points is None:
                  points = []

                  for i in range(
                      0,
                      len(u_rows),
                      sampling_step
                  ):
                      lat, lon, _ = u_rows[i]

                      points.append({
                          "lat": round(lat, 4),
                          "lon": round(lon, 4),
                          "forecast": []
                      })

              point_index = 0

              for i in range(
                  0,
                  len(u_rows),
                  sampling_step
              ):
                  lat, lon, u = u_rows[i]
                  _, _, v = v_rows[i]
                  _, _, temp_k = t_rows[i]

                  speed_ms = math.sqrt(
                      u * u +
                      v * v
                  )

                  direction = (
                      math.degrees(
                          math.atan2(
                              -u,
                              -v
                          )
                      )
                      + 360
                  ) % 360

                  points[
                      point_index
                  ]["forecast"].append({
                      "hour": forecast_hour,
                      "valid_time": valid_time,
                      "temperature_c": round(
                          temp_k - 273.15,
                          1
                      ),
                      "wind_speed_kmh": round(
                          speed_ms * 3.6,
                          1
                      ),
                      "wind_direction_deg": round(
                          direction
                      )
                  })

                  point_index += 1

          result = {
              "status": "ok",
              "source": "DWD Open Data",
              "model": "ICON-D2",
              "model_run": RUN_ID,
              "forecast_hours": 24,
              "forecast_interval_hours": 1,
              "generated_at": datetime.now(
                  timezone.utc
              ).isoformat(),
              "attribution":
                  "Deutscher Wetterdienst (DWD)",
              "sampling": {
                  "step": sampling_step,
                  "exported_points": len(points)
              },
              "points": points
          }

          with open(
              "icon-d2-24h.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  result,
                  f,
                  separators=(",", ":"),
                  ensure_ascii=False
              )

          with open(
              "icon-d2-24h-run.txt",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(RUN_ID)

          print("Modelllauf:", RUN_ID)
          print("Rasterpunkte:", len(points))
          print("Zeitschritte je Punkt: 25")
          PY

      - name: ICON-D2 24h zu STRATO übertragen
        if: steps.changed.outputs.new_data == 'true'
        env:
          SSHPASS: ${{ secrets.STRATO_PASSWORD }}

        run: |
          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            "${{ secrets.STRATO_USER }}@${{ secrets.STRATO_HOST }}" \
            "mkdir -p Orend/paraweather-data"

          sshpass -e scp \
            -o StrictHostKeyChecking=no \
            icon-d2-24h.json \
            "${{ secrets.STRATO_USER }}@${{ secrets.STRATO_HOST }}:Orend/paraweather-data/icon-d2-24h.json"

          sshpass -e scp \
            -o StrictHostKeyChecking=no \
            icon-d2-24h-run.txt \
            "${{ secrets.STRATO_USER }}@${{ secrets.STRATO_HOST }}:Orend/paraweather-data/icon-d2-24h-run.txt"

      - name: Kein neuer ICON-D2 Lauf
        if: steps.changed.outputs.new_data == 'false'
        run: |
          echo "ICON-D2 24h ist bereits aktuell."
          echo "Keine GRIB-Dateien geladen."
          echo "Keine Daten neu verarbeitet."
          echo "Kein STRATO-Upload notwendig."
