name: ParaWeather ICON-D2 Pipeline

on:
  workflow_dispatch:

jobs:
  icon-d2:
    runs-on: ubuntu-latest

    steps:
      - name: Werkzeuge installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeccodes-tools bzip2 sshpass

      - name: ICON-D2 Daten laden
        run: |
          RUN=$(date -u +%Y%m%d00)
          BASE="https://opendata.dwd.de/weather/nwp/icon-d2/grib/00"

          curl -fL \
            "$BASE/u_10m/icon-d2_germany_regular-lat-lon_single-level_${RUN}_000_2d_u_10m.grib2.bz2" \
            -o u.grib2.bz2

          curl -fL \
            "$BASE/v_10m/icon-d2_germany_regular-lat-lon_single-level_${RUN}_000_2d_v_10m.grib2.bz2" \
            -o v.grib2.bz2

          curl -fL \
            "$BASE/t_2m/icon-d2_germany_regular-lat-lon_single-level_${RUN}_000_2d_t_2m.grib2.bz2" \
            -o t.grib2.bz2

          bunzip2 u.grib2.bz2
          bunzip2 v.grib2.bz2
          bunzip2 t.grib2.bz2

      - name: ICON-D2 Raster auslesen
        run: |
          python3 <<'PY'
          import subprocess
          import json
          import math
          from datetime import datetime, timezone

          def read_values(path):
              output = subprocess.check_output(
                  ["grib_get_data", path],
                  text=True,
                  stderr=subprocess.STDOUT
              )

              rows = []

              for line in output.splitlines():
                  parts = line.split()

                  if len(parts) < 3:
                      continue

                  try:
                      lat = float(parts[0])
                      lon = float(parts[1])
                      value = float(parts[-1])
                  except ValueError:
                      continue

                  rows.append((lat, lon, value))

              if not rows:
                  raise RuntimeError(f"Keine Rasterdaten aus {path} gelesen")

              return rows

          u_rows = read_values("u.grib2")
          v_rows = read_values("v.grib2")
          t_rows = read_values("t.grib2")

          if not (len(u_rows) == len(v_rows) == len(t_rows)):
              raise RuntimeError("ICON-D2 Rastergrößen stimmen nicht überein")

          points = []

          # Vorläufig datensparsam: jeder 10. Rasterpunkt
          step = 10

          for i in range(0, len(u_rows), step):
              lat, lon, u = u_rows[i]
              _, _, v = v_rows[i]
              _, _, temp_k = t_rows[i]

              speed_ms = math.sqrt(u * u + v * v)
              direction = (
                  math.degrees(math.atan2(-u, -v)) + 360
              ) % 360

              points.append({
                  "lat": round(lat, 4),
                  "lon": round(lon, 4),
                  "temperature_c": round(temp_k - 273.15, 1),
                  "wind_speed_kmh": round(speed_ms * 3.6, 1),
                  "wind_direction_deg": round(direction)
              })

          result = {
              "status": "ok",
              "source": "DWD Open Data",
              "model": "ICON-D2",
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "attribution": "Deutscher Wetterdienst (DWD)",
              "sampling": {
                  "original_points": len(u_rows),
                  "step": step,
                  "exported_points": len(points)
              },
              "points": points
          }

          with open("icon-d2-grid.json", "w", encoding="utf-8") as f:
              json.dump(
                  result,
                  f,
                  separators=(",", ":"),
                  ensure_ascii=False
              )

          print("Original Rasterpunkte:", len(u_rows))
          print("Exportierte Rasterpunkte:", len(points))
          PY

      - name: ICON-D2 zu STRATO übertragen
        env:
          SSHPASS: ${{ secrets.STRATO_PASSWORD }}
        run: |
          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            "${{ secrets.STRATO_USER }}@${{ secrets.STRATO_HOST }}" \
            "mkdir -p Orend/paraweather-data"

          sshpass -e scp \
            -o StrictHostKeyChecking=no \
            icon-d2-grid.json \
            "${{ secrets.STRATO_USER }}@${{ secrets.STRATO_HOST }}:Orend/paraweather-data/icon-d2-grid.json"
