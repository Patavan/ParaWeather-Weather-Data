name: ParaWeather ICON-D2 Pipeline

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Lauf für einen vollständigen Test erneut verarbeiten"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "*/30 * * * *"

jobs:
  icon-d2:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. WERKZEUGE
      # ============================================================

      - name: Werkzeuge installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libeccodes-tools \
            cdo \
            bzip2 \
            sshpass

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-delay 2 \
            --retry-all-errors \
            "https://opendata.dwd.de/weather/lib/cdo/ICON_D2_002_EASY.tar.bz2" \
            -o ICON_D2_002_EASY.tar.bz2

          tar \
            -xf ICON_D2_002_EASY.tar.bz2

          cat > target_grid_icon_d2_010.txt <<'EOF'
          gridtype = lonlat
          xsize    = 243
          ysize    = 149
          xfirst   = -3.94
          xinc     = 0.1
          yfirst   = 43.18
          yinc     = 0.1
          EOF

      # ============================================================
      # 2. NEUESTEN VOLLSTÄNDIGEN ICON-D2 LAUF FINDEN
      # ============================================================

      - name: Neuesten vollständigen ICON-D2 Lauf finden
        id: detect
        run: |
          python3 <<'PY'

          import urllib.request
          import os

          from datetime import (
              datetime,
              timezone,
              timedelta
          )

          now = datetime.now(
              timezone.utc
          )

          base_hour = (
              now.hour // 3
          ) * 3

          base = now.replace(
              hour=base_hour,
              minute=0,
              second=0,
              microsecond=0
          )

          surface_fields = [
              "u_10m",
              "v_10m",
              "t_2m",
              "vmax_10m",
              "tot_prec",
              "clct",
              "pmsl"
          ]

          upper_levels = [
              60,
              61,
              62,
              63,
              64,
              65
          ]

          found = None


          def exists(url):

              try:

                  request = urllib.request.Request(
                      url,
                      method="HEAD"
                  )

                  with urllib.request.urlopen(
                      request,
                      timeout=15
                  ) as response:

                      return (
                          response.status
                          == 200
                      )

              except Exception:

                  return False


          for back in range(
              0,
              24,
              3
          ):

              run = (
                  base
                  - timedelta(
                      hours=back
                  )
              )

              date = run.strftime(
                  "%Y%m%d"
              )

              hour = run.strftime(
                  "%H"
              )

              run_id = (
                  f"{date}{hour}"
              )

              root = (
                  "https://opendata.dwd.de/"
                  "weather/nwp/icon-d2/grib/"
                  f"{hour}"
              )

              print(
                  "Prüfe ICON-D2 Lauf:",
                  run_id
              )

              complete = True


              #
              # Bodenfelder +24h prüfen
              #
              for field in surface_fields:

                  url = (
                      f"{root}/{field}/"
                      "icon-d2_germany_"
                      "regular-lat-lon_"
                      "single-level_"
                      f"{run_id}_024_"
                      f"2d_{field}.grib2.bz2"
                  )

                  if not exists(url):

                      print(
                          "Fehlt:",
                          url
                      )

                      complete = False
                      break


              if not complete:

                  continue


              #
              # Höhenwind +24h prüfen
              #
              for level in upper_levels:

                  u_url = (
                      f"{root}/u/"
                      "icon-d2_germany_"
                      "icosahedral_"
                      "model-level_"
                      f"{run_id}_024_"
                      f"{level}_u.grib2.bz2"
                  )

                  v_url = (
                      f"{root}/v/"
                      "icon-d2_germany_"
                      "icosahedral_"
                      "model-level_"
                      f"{run_id}_024_"
                      f"{level}_v.grib2.bz2"
                  )

                  if (
                      not exists(u_url)
                      or
                      not exists(v_url)
                  ):

                      print(
                          "Höhenwind noch nicht vollständig:",
                          level
                      )

                      complete = False
                      break


              if complete:

                  found = (
                      date,
                      hour,
                      run_id
                  )

                  break


          if found is None:

              raise RuntimeError(
                  "Kein vollständiger "
                  "ICON-D2 Lauf gefunden"
              )


          date, hour, run_id = found

          print(
              "Verwendeter ICON-D2 Lauf:",
              run_id
          )


          with open(
              os.environ[
                  "GITHUB_OUTPUT"
              ],
              "a"
          ) as output:

              output.write(
                  f"date={date}\n"
              )

              output.write(
                  f"hour={hour}\n"
              )

              output.write(
                  f"run_id={run_id}\n"
              )

          PY

      # ============================================================
      # 3. PRÜFEN OB LAUF BEREITS AUF STRATO LIEGT
      # ============================================================

      - name: Prüfen ob Lauf bereits verarbeitet wurde
        id: changed
        run: |

          CURRENT_RUN="${{ steps.detect.outputs.run_id }}"

          REMOTE_RUN=$(
            curl -fsS \
              "https://www.orend.org/paraweather-data/icon-d2-tiles-run.txt" \
              2>/dev/null \
              || true
          )

          echo "DWD Lauf:    $CURRENT_RUN"
          echo "STRATO Lauf: $REMOTE_RUN"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             [ "${{ inputs.force }}" = "true" ]; then

            echo "Vollständige Verarbeitung wurde manuell erzwungen."

            echo \
              "new_data=true" \
              >> "$GITHUB_OUTPUT"

          elif [ "$CURRENT_RUN" = "$REMOTE_RUN" ]; then

            echo "ICON-D2 ist bereits aktuell."

            echo \
              "new_data=false" \
              >> "$GITHUB_OUTPUT"

          else

            echo "Neuer ICON-D2 Lauf vorhanden."

            echo \
              "new_data=true" \
              >> "$GITHUB_OUTPUT"

          fi

      # ============================================================
      # 4. BODENWETTER 0–24H LADEN
      # ============================================================

      - name: ICON-D2 Bodenwetter 0-24h laden
        if: steps.changed.outputs.new_data == 'true'
        run: |

          set -euo pipefail

          HOUR="${{ steps.detect.outputs.hour }}"
          RUN="${{ steps.detect.outputs.run_id }}"

          BASE="https://opendata.dwd.de/weather/nwp/icon-d2/grib/${HOUR}"

          mkdir -p \
            grib/surface

          FIELDS="
          u_10m
          v_10m
          t_2m
          vmax_10m
          tot_prec
          clct
          pmsl
          "

          for STEP in $(seq 0 24); do

            FSTEP=$(
              printf "%03d" "$STEP"
            )

            echo
            echo "================================"
            echo "Bodenwetter +${FSTEP}h"
            echo "================================"

            for FIELD in $FIELDS; do

              echo "Lade ${FIELD}"

              URL="$BASE/$FIELD/icon-d2_germany_regular-lat-lon_single-level_${RUN}_${FSTEP}_2d_${FIELD}.grib2.bz2"

              TARGET="grib/surface/${FIELD}_${FSTEP}.grib2.bz2"

              curl \
                --fail \
                --location \
                --retry 3 \
                --retry-delay 2 \
                --retry-all-errors \
                "$URL" \
                -o "$TARGET"

              bunzip2 \
                "$TARGET"

            done

          done

      # ============================================================
      # 5. HÖHENWIND 0–24H LADEN
      # ============================================================

      - name: ICON-D2 Höhenwind-Dateien laden
        if: steps.changed.outputs.new_data == 'true'
        run: |

          set -euo pipefail

          HOUR="${{ steps.detect.outputs.hour }}"
          RUN="${{ steps.detect.outputs.run_id }}"

          BASE="https://opendata.dwd.de/weather/nwp/icon-d2/grib/${HOUR}"

          mkdir -p \
            grib/upper

          LEVELS="
          60
          61
          62
          63
          64
          65
          "

          for STEP in $(seq 0 24); do

            FSTEP=$(
              printf "%03d" "$STEP"
            )

            echo
            echo "================================"
            echo "Höhenwind +${FSTEP}h"
            echo "================================"

            for LEVEL in $LEVELS; do

              echo "Modelllevel ${LEVEL}"

              U_URL="$BASE/u/icon-d2_germany_icosahedral_model-level_${RUN}_${FSTEP}_${LEVEL}_u.grib2.bz2"

              V_URL="$BASE/v/icon-d2_germany_icosahedral_model-level_${RUN}_${FSTEP}_${LEVEL}_v.grib2.bz2"

              U_TARGET="grib/upper/u_${FSTEP}_${LEVEL}.grib2.bz2"

              V_TARGET="grib/upper/v_${FSTEP}_${LEVEL}.grib2.bz2"

              curl \
                --fail \
                --location \
                --retry 3 \
                --retry-delay 2 \
                --retry-all-errors \
                "$U_URL" \
                -o "$U_TARGET"

              curl \
                --fail \
                --location \
                --retry 3 \
                --retry-delay 2 \
                --retry-all-errors \
                "$V_URL" \
                -o "$V_TARGET"

              bunzip2 \
                "$U_TARGET"

              bunzip2 \
                "$V_TARGET"

            done

          done

      # ============================================================
      # 6. BODEN-KACHELN ERZEUGEN
      # ============================================================

      - name: ICON-D2 Boden-Kacheln erzeugen
        if: steps.changed.outputs.new_data == 'true'
        run: |

          python3 <<'PY'

          import subprocess
          import json
          import math
          import os

          from datetime import (
              datetime,
              timezone,
              timedelta
          )


          RUN_ID = (
              "${{ steps.detect.outputs.run_id }}"
          )

          run_time = (
              datetime.strptime(
                  RUN_ID,
                  "%Y%m%d%H"
              )
              .replace(
                  tzinfo=timezone.utc
              )
          )


          os.makedirs(
              "surface-tiles",
              exist_ok=True
          )


          #
          # WICHTIG:
          #
          # Keine positionsabhängigen Arrays mehr.
          #
          # Jeder Wert wird über seine geografische
          # Koordinate gespeichert.
          #
          def read_values(path):

              output = (
                  subprocess.check_output(
                      [
                          "grib_get_data",
                          path
                      ],
                      text=True,
                      stderr=subprocess.STDOUT
                  )
              )

              values = {}

              for line in (
                  output.splitlines()
              ):

                  parts = line.split()

                  if len(parts) < 3:

                      continue

                  try:

                      lat = float(
                          parts[0]
                      )

                      lon = float(
                          parts[1]
                      )

                      value = float(
                          parts[-1]
                      )

                  except ValueError:

                      continue


                  #
                  # Koordinatenschlüssel.
                  #
                  # 6 Nachkommastellen reichen
                  # für das DWD-Raster sicher aus.
                  #
                  key = (
                      round(
                          lat,
                          6
                      ),
                      round(
                          lon,
                          6
                      )
                  )


                  values[
                      key
                  ] = (
                      lat,
                      lon,
                      value
                  )


              if not values:

                  raise RuntimeError(
                      "Keine Rasterdaten aus "
                      + path
                  )


              return values


          def tile_name(
              lat,
              lon
          ):

              lat_floor = (
                  math.floor(lat)
              )

              lon_floor = (
                  math.floor(lon)
              )

              lat_prefix = (
                  "N"
                  if lat_floor >= 0
                  else "S"
              )

              lon_prefix = (
                  "E"
                  if lon_floor >= 0
                  else "W"
              )

              return (
                  f"{lat_prefix}"
                  f"{abs(lat_floor):02d}_"
                  f"{lon_prefix}"
                  f"{abs(lon_floor):03d}"
              )


          sampling_step = 10

          tiles = {}


          for forecast_hour in range(
              25
          ):

              fstep = (
                  f"{forecast_hour:03d}"
              )

              print(
                  "Verarbeite Boden +",
                  fstep,
                  "h"
              )


              u_map = read_values(
                  f"grib/surface/"
                  f"u_10m_{fstep}.grib2"
              )

              v_map = read_values(
                  f"grib/surface/"
                  f"v_10m_{fstep}.grib2"
              )

              t_map = read_values(
                  f"grib/surface/"
                  f"t_2m_{fstep}.grib2"
              )

              gust_map = read_values(
                  f"grib/surface/"
                  f"vmax_10m_{fstep}.grib2"
              )

              precip_map = read_values(
                  f"grib/surface/"
                  f"tot_prec_{fstep}.grib2"
              )

              cloud_map = read_values(
                  f"grib/surface/"
                  f"clct_{fstep}.grib2"
              )

              pressure_map = read_values(
                  f"grib/surface/"
                  f"pmsl_{fstep}.grib2"
              )


              print(
                  "Rastergrößen:",
                  "U=",
                  len(u_map),
                  "V=",
                  len(v_map),
                  "T=",
                  len(t_map),
                  "GUST=",
                  len(gust_map),
                  "PREC=",
                  len(precip_map),
                  "CLOUD=",
                  len(cloud_map),
                  "PMSL=",
                  len(pressure_map)
              )


              #
              # Nur geografisch tatsächlich
              # gemeinsame Rasterpunkte verwenden.
              #
              common_keys = (
                  set(
                      u_map.keys()
                  )
                  & set(
                      v_map.keys()
                  )
                  & set(
                      t_map.keys()
                  )
                  & set(
                      gust_map.keys()
                  )
                  & set(
                      precip_map.keys()
                  )
                  & set(
                      cloud_map.keys()
                  )
                  & set(
                      pressure_map.keys()
                  )
              )


              if not common_keys:

                  raise RuntimeError(
                      "Keine gemeinsamen "
                      "Boden-Rasterpunkte "
                      f"bei +{fstep}h"
                  )


              common_keys = sorted(
                  common_keys
              )


              print(
                  "Gemeinsame Bodenpunkte:",
                  len(
                      common_keys
                  )
              )


              valid_time = (
                  run_time
                  + timedelta(
                      hours=forecast_hour
                  )
              ).isoformat()


              #
              # Wie bisher ungefähr jeder
              # 10. Rasterpunkt.
              #
              for index, key in enumerate(
                  common_keys
              ):

                  if (
                      index
                      % sampling_step
                      != 0
                  ):

                      continue


                  lat, lon, u = (
                      u_map[
                          key
                      ]
                  )

                  _, _, v = (
                      v_map[
                          key
                      ]
                  )

                  _, _, temp_k = (
                      t_map[
                          key
                      ]
                  )

                  _, _, gust_ms = (
                      gust_map[
                          key
                      ]
                  )

                  _, _, precip = (
                      precip_map[
                          key
                      ]
                  )

                  _, _, cloud = (
                      cloud_map[
                          key
                      ]
                  )

                  _, _, pressure_pa = (
                      pressure_map[
                          key
                      ]
                  )


                  tile = tile_name(
                      lat,
                      lon
                  )


                  if tile not in tiles:

                      tiles[
                          tile
                      ] = {}


                  point_key = (
                      f"{round(lat,4)},"
                      f"{round(lon,4)}"
                  )


                  if (
                      point_key
                      not in tiles[
                          tile
                      ]
                  ):

                      tiles[
                          tile
                      ][
                          point_key
                      ] = {

                          "lat":
                              round(
                                  lat,
                                  4
                              ),

                          "lon":
                              round(
                                  lon,
                                  4
                              ),

                          "forecast":
                              []
                      }


                  wind_ms = math.sqrt(
                      u * u
                      + v * v
                  )


                  direction = (
                      math.degrees(
                          math.atan2(
                              -u,
                              -v
                          )
                      )
                      + 360
                  ) % 360


                  tiles[
                      tile
                  ][
                      point_key
                  ][
                      "forecast"
                  ].append({

                      "hour":
                          forecast_hour,

                      "valid_time":
                          valid_time,

                      "temperature_c":
                          round(
                              temp_k
                              - 273.15,
                              1
                          ),

                      "wind_speed_kmh":
                          round(
                              wind_ms
                              * 3.6,
                              1
                          ),

                      "wind_direction_deg":
                          round(
                              direction
                          ),

                      "wind_gust_kmh":
                          round(
                              gust_ms
                              * 3.6,
                              1
                          ),

                      "precipitation_mm":
                          round(
                              max(
                                  precip,
                                  0.0
                              ),
                              2
                          ),

                      "cloud_cover_percent":
                          round(
                              max(
                                  0.0,
                                  min(
                                      100.0,
                                      cloud
                                  )
                              ),
                              1
                          ),

                      "pressure_msl_hpa":
                          round(
                              pressure_pa
                              / 100.0,
                              1
                          )
                  })


          generated_at = (
              datetime.now(
                  timezone.utc
              ).isoformat()
          )


          tile_names = []

          total_points = 0


          for (
              tile,
              point_map
          ) in tiles.items():

              tile_names.append(
                  tile
              )

              points = list(
                  point_map.values()
              )

              total_points += len(
                  points
              )


              output = {

                  "status":
                      "ok",

                  "source":
                      "DWD Open Data",

                  "model":
                      "ICON-D2",

                  "model_run":
                      RUN_ID,

                  "tile":
                      tile,

                  "grid":
                      "regular-lat-lon",

                  "forecast_hours":
                      24,

                  "forecast_interval_hours":
                      1,

                  "generated_at":
                      generated_at,

                  "attribution":
                      "Deutscher Wetterdienst (DWD)",

                  "sampling_step":
                      sampling_step,

                  "parameters": [
                      "temperature_c",
                      "wind_speed_kmh",
                      "wind_direction_deg",
                      "wind_gust_kmh",
                      "precipitation_mm",
                      "cloud_cover_percent",
                      "pressure_msl_hpa"
                  ],

                  "points":
                      points
              }


              with open(
                  f"surface-tiles/"
                  f"{tile}.json",
                  "w",
                  encoding="utf-8"
              ) as file:

                  json.dump(
                      output,
                      file,
                      separators=(
                          ",",
                          ":"
                      ),
                      ensure_ascii=False
                  )


          index = {

              "status":
                  "ok",

              "source":
                  "DWD Open Data",

              "model":
                  "ICON-D2",

              "model_run":
                  RUN_ID,

              "dataset":
                  "surface",

              "grid":
                  "regular-lat-lon",

              "generated_at":
                  generated_at,

              "tile_count":
                  len(
                      tile_names
                  ),

              "total_points":
                  total_points,

              "forecast_hours":
                  24,

              "forecast_interval_hours":
                  1,

              "sampling_step":
                  sampling_step,

              "attribution":
                  "Deutscher Wetterdienst (DWD)",

              "tiles":
                  sorted(
                      tile_names
                  )
          }


          with open(
              "icon-d2-index.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  index,
                  file,
                  separators=(
                      ",",
                      ":"
                  ),
                  ensure_ascii=False
              )


          print(
              "Boden-Kacheln:",
              len(
                  tile_names
              )
          )

          print(
              "Boden-Rasterpunkte:",
              total_points
          )

          PY

      # ============================================================
      # 7. HÖHENWIND-KACHELN ERZEUGEN
      # ============================================================

      - name: ICON-D2 Höhenwind-Kacheln erzeugen
        if: steps.changed.outputs.new_data == 'true'
        run: |

          python3 <<'PY'

          import subprocess
          import json
          import math
          import os

          from datetime import (
              datetime,
              timezone,
              timedelta
          )


          RUN_ID = (
              "${{ steps.detect.outputs.run_id }}"
          )


          MODEL_LEVELS = [
              60,
              61,
              62,
              63,
              64,
              65
          ]


          run_time = (
              datetime.strptime(
                  RUN_ID,
                  "%Y%m%d%H"
              )
              .replace(
                  tzinfo=timezone.utc
              )
          )


          os.makedirs(
              "upper-tiles",
              exist_ok=True
          )


          #
          # Auch hier keine Kopplung
          # über Array-Indizes.
          #
          def read_values(path):

              # ICON-D2-Modelllevel liegen auf dem nativen, unstrukturierten
              # Dreiecksgitter. Die GRIB-Datei enthält keine geografischen
              # Koordinaten pro Punkt; grib_get_data kann sie daher nicht
              # direkt ausgeben. Mit den offiziellen DWD-Gewichten wird
              # zuerst auf 0,02 Grad und anschließend auf die von der App
              # benötigten 0,1 Grad remappt.
              output = (
                  subprocess.check_output(
                      [
                          "cdo",
                          "-s",
                          "outputtab,lat,lon,value",
                          "-remapnn,target_grid_icon_d2_010.txt",
                          "-remap,ICON_D2_002_EASY/target_grid_icon_d2_002.txt,ICON_D2_002_EASY/weights_icon_d2_002.nc",
                          path
                      ],
                      text=True,
                      stderr=subprocess.STDOUT
                  )
              )

              values = {}

              for line in (
                  output.splitlines()
              ):

                  parts = line.split()

                  if len(parts) < 3:

                      continue

                  try:

                      lat = float(
                          parts[0]
                      )

                      lon = float(
                          parts[1]
                      )

                      value = float(
                          parts[-1]
                      )

                  except ValueError:

                      continue


                  key = (
                      round(
                          lat,
                          6
                      ),
                      round(
                          lon,
                          6
                      )
                  )


                  values[
                      key
                  ] = (
                      lat,
                      lon,
                      value
                  )


              if not values:

                  raise RuntimeError(
                      "Keine Höhenwinddaten aus "
                      + path
                  )


              return values


          def tile_name(
              lat,
              lon
          ):

              lat_floor = (
                  math.floor(lat)
              )

              lon_floor = (
                  math.floor(lon)
              )

              lat_prefix = (
                  "N"
                  if lat_floor >= 0
                  else "S"
              )

              lon_prefix = (
                  "E"
                  if lon_floor >= 0
                  else "W"
              )

              return (
                  f"{lat_prefix}"
                  f"{abs(lat_floor):02d}_"
                  f"{lon_prefix}"
                  f"{abs(lon_floor):03d}"
              )


          spatial_step_deg = 0.1

          tiles = {}


          for forecast_hour in range(
              25
          ):

              fstep = (
                  f"{forecast_hour:03d}"
              )

              print(
                  "Verarbeite Höhenwind +",
                  fstep,
                  "h"
              )


              valid_time = (
                  run_time
                  + timedelta(
                      hours=forecast_hour
                  )
              ).isoformat()


              #
              # Alle Level zuerst laden.
              #
              level_maps = {}


              for level in MODEL_LEVELS:

                  print(
                      "  Level",
                      level
                  )


                  u_map = read_values(
                      f"grib/upper/"
                      f"u_{fstep}_{level}.grib2"
                  )

                  v_map = read_values(
                      f"grib/upper/"
                      f"v_{fstep}_{level}.grib2"
                  )


                  common_uv = (
                      set(
                          u_map.keys()
                      )
                      & set(
                          v_map.keys()
                      )
                  )


                  if not common_uv:

                      raise RuntimeError(
                          "Keine gemeinsamen "
                          "U/V Rasterpunkte "
                          f"Level {level} "
                          f"+{fstep}h"
                      )


                  level_maps[
                      level
                  ] = {
                      "u": u_map,
                      "v": v_map,
                      "keys": common_uv
                  }


              #
              # Nur Punkte verwenden,
              # die in ALLEN Modellleveln
              # vorhanden sind.
              #
              common_all_levels = None


              for level in MODEL_LEVELS:

                  keys = (
                      level_maps[
                          level
                      ][
                          "keys"
                      ]
                  )


                  if common_all_levels is None:

                      common_all_levels = set(
                          keys
                      )

                  else:

                      common_all_levels &= keys


              if not common_all_levels:

                  raise RuntimeError(
                      "Keine gemeinsamen "
                      "Höhenwind-Rasterpunkte "
                      "über alle Modelllevel "
                      f"bei +{fstep}h"
                  )


              common_all_levels = sorted(
                  common_all_levels
              )


              print(
                  "  Gemeinsame Punkte "
                  "über alle Level:",
                  len(
                      common_all_levels
                  )
              )


              #
              # Icosahedral-Raster räumlich
              # auf ungefähr 0,1° reduzieren.
              #
              selected_keys = []

              seen_cells = set()


              first_level = (
                  MODEL_LEVELS[
                      0
                  ]
              )


              for key in common_all_levels:

                  lat, lon, _ = (
                      level_maps[
                          first_level
                      ][
                          "u"
                      ][
                          key
                      ]
                  )


                  cell = (
                      round(
                          lat
                          / spatial_step_deg
                      ),
                      round(
                          lon
                          / spatial_step_deg
                      )
                  )


                  if cell in seen_cells:

                      continue


                  seen_cells.add(
                      cell
                  )

                  selected_keys.append(
                      key
                  )


              print(
                  "  Ausgewählte "
                  "Höhenwindpunkte:",
                  len(
                      selected_keys
                  )
              )


              hour_points = {}


              for key in selected_keys:

                  lat, lon, _ = (
                      level_maps[
                          first_level
                      ][
                          "u"
                      ][
                          key
                      ]
                  )


                  point_key = (
                      f"{round(lat,4)},"
                      f"{round(lon,4)}"
                  )


                  hour_points[
                      point_key
                  ] = {

                      "lat":
                          round(
                              lat,
                              4
                          ),

                      "lon":
                          round(
                              lon,
                              4
                          ),

                      "levels":
                          []
                  }


                  for level in MODEL_LEVELS:

                      _, _, u = (
                          level_maps[
                              level
                          ][
                              "u"
                          ][
                              key
                          ]
                      )

                      _, _, v = (
                          level_maps[
                              level
                          ][
                              "v"
                          ][
                              key
                          ]
                      )


                      speed_ms = math.sqrt(
                          u * u
                          + v * v
                      )


                      direction = (
                          math.degrees(
                              math.atan2(
                                  -u,
                                  -v
                              )
                          )
                          + 360
                      ) % 360


                      hour_points[
                          point_key
                      ][
                          "levels"
                      ].append({

                          "type":
                              "model_level",

                          "level":
                              level,

                          "wind_speed_kmh":
                              round(
                                  speed_ms
                                  * 3.6,
                                  1
                              ),

                          "wind_direction_deg":
                              round(
                                  direction
                              )
                      })


              #
              # Stundenwerte in geografische
              # Kacheln schreiben.
              #
              for (
                  point_key,
                  point
              ) in hour_points.items():

                  lat = point[
                      "lat"
                  ]

                  lon = point[
                      "lon"
                  ]

                  tile = tile_name(
                      lat,
                      lon
                  )


                  if tile not in tiles:

                      tiles[
                          tile
                      ] = {}


                  if (
                      point_key
                      not in tiles[
                          tile
                      ]
                  ):

                      tiles[
                          tile
                      ][
                          point_key
                      ] = {

                          "lat":
                              lat,

                          "lon":
                              lon,

                          "forecast":
                              []
                      }


                  tiles[
                      tile
                  ][
                      point_key
                  ][
                      "forecast"
                  ].append({

                      "hour":
                          forecast_hour,

                      "valid_time":
                          valid_time,

                      "levels":
                          point[
                              "levels"
                          ]
                  })


          generated_at = (
              datetime.now(
                  timezone.utc
              ).isoformat()
          )


          tile_names = []

          total_points = 0


          for (
              tile,
              point_map
          ) in tiles.items():

              tile_names.append(
                  tile
              )

              points = list(
                  point_map.values()
              )

              total_points += len(
                  points
              )


              output = {

                  "status":
                      "ok",

                  "source":
                      "DWD Open Data",

                  "model":
                      "ICON-D2",

                  "model_run":
                      RUN_ID,

                  "dataset":
                      "upper_air",

                  "tile":
                      tile,

                  "grid":
                      "icosahedral",

                  "vertical_coordinate":
                      "model_level",

                  "model_levels":
                      MODEL_LEVELS,

                  "forecast_hours":
                      24,

                  "forecast_interval_hours":
                      1,

                  "spatial_sampling_deg":
                      spatial_step_deg,

                  "generated_at":
                      generated_at,

                  "attribution":
                      "Deutscher Wetterdienst (DWD)",

                  "points":
                      points
              }


              with open(
                  f"upper-tiles/"
                  f"{tile}.json",
                  "w",
                  encoding="utf-8"
              ) as file:

                  json.dump(
                      output,
                      file,
                      separators=(
                          ",",
                          ":"
                      ),
                      ensure_ascii=False
                  )


          index = {

              "status":
                  "ok",

              "source":
                  "DWD Open Data",

              "model":
                  "ICON-D2",

              "model_run":
                  RUN_ID,

              "dataset":
                  "upper_air",

              "grid":
                  "icosahedral",

              "vertical_coordinate":
                  "model_level",

              "model_levels":
                  MODEL_LEVELS,

              "generated_at":
                  generated_at,

              "tile_count":
                  len(
                      tile_names
                  ),

              "total_points":
                  total_points,

              "forecast_hours":
                  24,

              "forecast_interval_hours":
                  1,

              "spatial_sampling_deg":
                  spatial_step_deg,

              "attribution":
                  "Deutscher Wetterdienst (DWD)",

              "tiles":
                  sorted(
                      tile_names
                  )
          }


          with open(
              "icon-d2-upper-index.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  index,
                  file,
                  separators=(
                      ",",
                      ":"
                  ),
                  ensure_ascii=False
              )


          print(
              "Höhenwind-Kacheln:",
              len(
                  tile_names
              )
          )

          print(
              "Höhenwindpunkte:",
              total_points
          )

          PY

      # ============================================================
      # 8. ARCHIVE ERSTELLEN
      # ============================================================

      - name: ICON-D2 Archive erstellen
        if: steps.changed.outputs.new_data == 'true'
        run: |

          tar \
            -czf \
            icon-d2-tiles.tar.gz \
            surface-tiles

          tar \
            -czf \
            icon-d2-upper-tiles.tar.gz \
            upper-tiles

          echo
          echo "Bodenarchiv:"
          ls -lh \
            icon-d2-tiles.tar.gz

          echo
          echo "Höhenwindarchiv:"
          ls -lh \
            icon-d2-upper-tiles.tar.gz

          echo
          echo "Bodenkacheln:"
          ls \
            surface-tiles \
            | wc -l

          echo
          echo "Höhenwindkacheln:"
          ls \
            upper-tiles \
            | wc -l

      # ============================================================
      # 9. LAUFMARKER ERZEUGEN
      # ============================================================

      - name: ICON-D2 Laufmarker erzeugen
        if: steps.changed.outputs.new_data == 'true'
        run: |

          echo -n \
            "${{ steps.detect.outputs.run_id }}" \
            > icon-d2-tiles-run.txt

      # ============================================================
      # 10. ZU STRATO ÜBERTRAGEN
      # ============================================================

      - name: ICON-D2 zu STRATO übertragen
        if: steps.changed.outputs.new_data == 'true'

        env:

          SSHPASS: ${{ secrets.STRATO_PASSWORD }}

        run: |

          set -euo pipefail

          echo "Zielverzeichnis vorbereiten"

          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            "${{ secrets.STRATO_USER }}@${{ secrets.STRATO_HOST }}" \
            "mkdir -p Orend/paraweather-data"


          echo "Bodenarchiv übertragen"

          sshpass -e scp \
            -o StrictHostKeyChecking=no \
            icon-d2-tiles.tar.gz \
            "${{ secrets.STRATO_USER }}@${{ secrets.STRATO_HOST }}:Orend/paraweather-data/icon-d2-tiles.tar.gz"


          echo "Höhenwindarchiv übertragen"

          sshpass -e scp \
            -o StrictHostKeyChecking=no \
            icon-d2-upper-tiles.tar.gz \
            "${{ secrets.STRATO_USER }}@${{ secrets.STRATO_HOST }}:Orend/paraweather-data/icon-d2-upper-tiles.tar.gz"


          echo "Bodenindex übertragen"

          sshpass -e scp \
            -o StrictHostKeyChecking=no \
            icon-d2-index.json \
            "${{ secrets.STRATO_USER }}@${{ secrets.STRATO_HOST }}:Orend/paraweather-data/icon-d2-index.json"


          echo "Höhenwindindex übertragen"

          sshpass -e scp \
            -o StrictHostKeyChecking=no \
            icon-d2-upper-index.json \
            "${{ secrets.STRATO_USER }}@${{ secrets.STRATO_HOST }}:Orend/paraweather-data/icon-d2-upper-index.json"


          echo "Kacheln auf STRATO austauschen"

          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            "${{ secrets.STRATO_USER }}@${{ secrets.STRATO_HOST }}" \
            '
            set -e

            cd Orend/paraweather-data

            rm -rf icon-d2-tiles-new
            rm -rf icon-d2-upper-tiles-new

            mkdir icon-d2-tiles-new
            mkdir icon-d2-upper-tiles-new

            tar -xzf \
              icon-d2-tiles.tar.gz \
              -C icon-d2-tiles-new \
              --strip-components=1

            tar -xzf \
              icon-d2-upper-tiles.tar.gz \
              -C icon-d2-upper-tiles-new \
              --strip-components=1

            rm -rf icon-d2-tiles-old
            rm -rf icon-d2-upper-tiles-old

            if [ -d icon-d2-tiles ]; then

              mv \
                icon-d2-tiles \
                icon-d2-tiles-old

            fi

            if [ -d icon-d2-upper-tiles ]; then

              mv \
                icon-d2-upper-tiles \
                icon-d2-upper-tiles-old

            fi

            mv \
              icon-d2-tiles-new \
              icon-d2-tiles

            mv \
              icon-d2-upper-tiles-new \
              icon-d2-upper-tiles

            rm -rf \
              icon-d2-tiles-old

            rm -rf \
              icon-d2-upper-tiles-old

            rm -f \
              icon-d2-tiles.tar.gz

            rm -f \
              icon-d2-upper-tiles.tar.gz

            '


          #
          # Laufmarker NUR hochladen,
          # wenn ALLES erfolgreich war.
          #
          echo "Laufmarker übertragen"

          sshpass -e scp \
            -o StrictHostKeyChecking=no \
            icon-d2-tiles-run.txt \
            "${{ secrets.STRATO_USER }}@${{ secrets.STRATO_HOST }}:Orend/paraweather-data/icon-d2-tiles-run.txt"


          echo
          echo "ICON-D2 erfolgreich aktualisiert."

      # ============================================================
      # 11. KEIN NEUER LAUF
      # ============================================================

      - name: Kein neuer ICON-D2 Lauf
        if: steps.changed.outputs.new_data == 'false'
        run: |

          echo "ICON-D2 ist bereits aktuell."
          echo "Keine Daten neu geladen."
          echo "Keine Daten neu verarbeitet."
          echo "Kein STRATO-Upload notwendig."
