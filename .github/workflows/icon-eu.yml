name: ParaWeather ICON-EU Pipeline

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Lauf für einen vollständigen Test erneut verarbeiten"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "10 */1 * * *"

jobs:
  icon-eu:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Werkzeuge installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libeccodes-tools bzip2 sshpass

      - name: Neuesten vollständigen ICON-EU Lauf finden
        id: detect
        run: |
          python3 <<'PY'
          import urllib.request
          from datetime import datetime, timezone, timedelta
          import os

          now = datetime.now(timezone.utc)
          base_hour = (now.hour // 3) * 3

          base = now.replace(
              hour=base_hour,
              minute=0,
              second=0,
              microsecond=0
          )

          fields = [
              ("u_10m", "U_10M"),
              ("v_10m", "V_10M"),
              ("t_2m", "T_2M"),
              ("vmax_10m", "VMAX_10M"),
              ("tot_prec", "TOT_PREC"),
              ("clct", "CLCT"),
              ("pmsl", "PMSL")
          ]

          found = None

          for back in range(0, 24, 3):

              run = base - timedelta(hours=back)

              date = run.strftime("%Y%m%d")
              hour = run.strftime("%H")

              root = (
                  f"https://opendata.dwd.de/weather/nwp/"
                  f"icon-eu/grib/{hour}"
              )

              complete = True

              for folder, filename_field in fields:

                  url = (
                      f"{root}/{folder}/"
                      f"icon-eu_europe_regular-lat-lon_single-level_"
                      f"{date}{hour}_024_{filename_field}.grib2.bz2"
                  )

                  try:
                      request = urllib.request.Request(
                          url,
                          method="HEAD"
                      )

                      with urllib.request.urlopen(
                          request,
                          timeout=15
                      ) as response:

                          if response.status != 200:
                              complete = False
                              break

                  except Exception:
                      complete = False
                      break

              if complete:
                  found = (
                      date,
                      hour
                  )
                  break

          if found is None:
              raise RuntimeError(
                  "Kein vollständiger ICON-EU 24h-Lauf gefunden"
              )

          date, hour = found
          run_id = f"{date}{hour}"

          print(
              "Gefundener ICON-EU Lauf:",
              run_id
          )

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a"
          ) as output:

              output.write(
                  f"date={date}\n"
              )

              output.write(
                  f"hour={hour}\n"
              )

              output.write(
                  f"run_id={run_id}\n"
              )
          PY

      - name: Prüfen ob Lauf bereits verarbeitet wurde
        id: changed
        run: |
          CURRENT_RUN="${{ steps.detect.outputs.run_id }}"

          REMOTE_RUN=$(
            curl -fsS \
            "https://www.orend.org/paraweather-data/icon-eu-run.txt" \
            2>/dev/null || true
          )

          echo "DWD ICON-EU Lauf: $CURRENT_RUN"
          echo "STRATO ICON-EU Lauf: $REMOTE_RUN"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && \
             [ "${{ inputs.force }}" = "true" ]; then

            echo "Volltest angefordert. Lauf wird erneut verarbeitet."
            echo "new_data=true" >> "$GITHUB_OUTPUT"

          elif [ "$CURRENT_RUN" = "$REMOTE_RUN" ]; then

            echo "Kein neuer Modelllauf."
            echo "new_data=false" >> "$GITHUB_OUTPUT"

          else

            echo "Neuer Modelllauf vorhanden."
            echo "new_data=true" >> "$GITHUB_OUTPUT"

          fi

      - name: ICON-EU 0-24h laden
        if: steps.changed.outputs.new_data == 'true'
        run: |
          HOUR="${{ steps.detect.outputs.hour }}"
          RUN="${{ steps.detect.outputs.run_id }}"

          BASE="https://opendata.dwd.de/weather/nwp/icon-eu/grib/${HOUR}"

          mkdir -p grib

          for STEP in $(seq 0 24); do

            FSTEP=$(printf "%03d" "$STEP")

            echo "ICON-EU +${FSTEP}h"

            curl -fL \
              "$BASE/u_10m/icon-eu_europe_regular-lat-lon_single-level_${RUN}_${FSTEP}_U_10M.grib2.bz2" \
              -o "grib/u_${FSTEP}.bz2"

            curl -fL \
              "$BASE/v_10m/icon-eu_europe_regular-lat-lon_single-level_${RUN}_${FSTEP}_V_10M.grib2.bz2" \
              -o "grib/v_${FSTEP}.bz2"

            curl -fL \
              "$BASE/t_2m/icon-eu_europe_regular-lat-lon_single-level_${RUN}_${FSTEP}_T_2M.grib2.bz2" \
              -o "grib/t_${FSTEP}.bz2"

            curl -fL \
              "$BASE/vmax_10m/icon-eu_europe_regular-lat-lon_single-level_${RUN}_${FSTEP}_VMAX_10M.grib2.bz2" \
              -o "grib/gust_${FSTEP}.bz2"

            curl -fL \
              "$BASE/tot_prec/icon-eu_europe_regular-lat-lon_single-level_${RUN}_${FSTEP}_TOT_PREC.grib2.bz2" \
              -o "grib/precip_${FSTEP}.bz2"

            curl -fL \
              "$BASE/clct/icon-eu_europe_regular-lat-lon_single-level_${RUN}_${FSTEP}_CLCT.grib2.bz2" \
              -o "grib/cloud_${FSTEP}.bz2"

            curl -fL \
              "$BASE/pmsl/icon-eu_europe_regular-lat-lon_single-level_${RUN}_${FSTEP}_PMSL.grib2.bz2" \
              -o "grib/pressure_${FSTEP}.bz2"

            for FILE in grib/*_${FSTEP}.bz2; do
              bunzip2 "$FILE"
            done
          done

      - name: ICON-EU Kacheln erzeugen
        if: steps.changed.outputs.new_data == 'true'
        run: |
          python3 <<'PY'
          import subprocess
          import json
          import math
          import os
          from datetime import datetime, timezone, timedelta

          RUN_ID = "${{ steps.detect.outputs.run_id }}"

          run_time = datetime.strptime(
              RUN_ID,
              "%Y%m%d%H"
          ).replace(
              tzinfo=timezone.utc
          )

          os.makedirs(
              "tiles",
              exist_ok=True
          )

          def read_values(path):

              output = subprocess.check_output(
                  [
                      "grib_get_data",
                      path
                  ],
                  text=True,
                  stderr=subprocess.STDOUT
              )

              rows = []

              for line in output.splitlines():

                  parts = line.split()

                  if len(parts) < 3:
                      continue

                  try:

                      lat = float(
                          parts[0]
                      )

                      lon = float(
                          parts[1]
                      )

                      value = float(
                          parts[-1]
                      )

                  except ValueError:
                      continue

                  rows.append(
                      (
                          lat,
                          lon,
                          value
                      )
                  )

              if not rows:
                  raise RuntimeError(
                      f"Keine Daten aus {path}"
                  )

              return rows

          def tile_name(
              lat,
              lon
          ):

              lat_floor = math.floor(
                  lat
              )

              lon_floor = math.floor(
                  lon
              )

              return (
                  ("N" if lat_floor >= 0 else "S")
                  + f"{abs(lat_floor):02d}_"
                  + ("E" if lon_floor >= 0 else "W")
                  + f"{abs(lon_floor):03d}"
              )

          tiles = {}

          #
          # ICON-EU ist gröber als ICON-D2.
          # Deshalb zunächst kein zusätzliches
          # starkes Downsampling.
          #
          sampling_step = 2

          for forecast_hour in range(
              25
          ):

              fstep = (
                  f"{forecast_hour:03d}"
              )

              print(
                  "Verarbeite ICON-EU +",
                  fstep,
                  "h"
              )

              u_rows = read_values(
                  f"grib/u_{fstep}"
              )

              v_rows = read_values(
                  f"grib/v_{fstep}"
              )

              t_rows = read_values(
                  f"grib/t_{fstep}"
              )

              gust_rows = read_values(
                  f"grib/gust_{fstep}"
              )

              precip_rows = read_values(
                  f"grib/precip_{fstep}"
              )

              cloud_rows = read_values(
                  f"grib/cloud_{fstep}"
              )

              pressure_rows = read_values(
                  f"grib/pressure_{fstep}"
              )

              lengths = {
                  len(u_rows),
                  len(v_rows),
                  len(t_rows),
                  len(gust_rows),
                  len(precip_rows),
                  len(cloud_rows),
                  len(pressure_rows)
              }

              if len(lengths) != 1:
                  raise RuntimeError(
                      f"ICON-EU Rastergrößen bei +{fstep}h stimmen nicht überein"
                  )

              valid_time = (
                  run_time
                  + timedelta(
                      hours=forecast_hour
                  )
              ).isoformat()

              for i in range(
                  0,
                  len(u_rows),
                  sampling_step
              ):

                  lat, lon, u = (
                      u_rows[i]
                  )

                  _, _, v = (
                      v_rows[i]
                  )

                  _, _, temp_k = (
                      t_rows[i]
                  )

                  _, _, gust_ms = (
                      gust_rows[i]
                  )

                  _, _, precip = (
                      precip_rows[i]
                  )

                  _, _, cloud = (
                      cloud_rows[i]
                  )

                  _, _, pressure_pa = (
                      pressure_rows[i]
                  )

                  #
                  # ParaWeather V1:
                  # nur europäischer Kernbereich.
                  #
                  if not (
                      35.0 <= lat <= 72.0
                      and
                      -12.0 <= lon <= 32.0
                  ):
                      continue

                  tile = tile_name(
                      lat,
                      lon
                  )

                  if tile not in tiles:
                      tiles[tile] = {}

                  key = (
                      f"{round(lat,3)},"
                      f"{round(lon,3)}"
                  )

                  if (
                      key
                      not in
                      tiles[tile]
                  ):

                      tiles[
                          tile
                      ][
                          key
                      ] = {
                          "lat":
                              round(
                                  lat,
                                  3
                              ),

                          "lon":
                              round(
                                  lon,
                                  3
                              ),

                          "forecast":
                              []
                      }

                  wind_ms = math.sqrt(
                      u*u
                      + v*v
                  )

                  direction = (
                      math.degrees(
                          math.atan2(
                              -u,
                              -v
                          )
                      )
                      + 360
                  ) % 360

                  tiles[
                      tile
                  ][
                      key
                  ][
                      "forecast"
                  ].append({

                      "hour":
                          forecast_hour,

                      "valid_time":
                          valid_time,

                      "temperature_c":
                          round(
                              temp_k
                              - 273.15,
                              1
                          ),

                      "wind_speed_kmh":
                          round(
                              wind_ms
                              * 3.6,
                              1
                          ),

                      "wind_direction_deg":
                          round(
                              direction
                          ),

                      "wind_gust_kmh":
                          round(
                              gust_ms
                              * 3.6,
                              1
                          ),

                      "precipitation_mm":
                          round(
                              max(
                                  precip,
                                  0.0
                              ),
                              2
                          ),

                      "cloud_cover_percent":
                          round(
                              max(
                                  0.0,
                                  min(
                                      100.0,
                                      cloud
                                  )
                              ),
                              1
                          ),

                      "pressure_msl_hpa":
                          round(
                              pressure_pa
                              / 100.0,
                              1
                          )
                  })

          generated_at = (
              datetime.now(
                  timezone.utc
              ).isoformat()
          )

          tile_names = []

          total_points = 0

          for tile, point_map in tiles.items():

              tile_names.append(
                  tile
              )

              points = list(
                  point_map.values()
              )

              total_points += len(
                  points
              )

              payload = {
                  "status":
                      "ok",

                  "source":
                      "DWD Open Data",

                  "model":
                      "ICON-EU",

                  "model_run":
                      RUN_ID,

                  "tile":
                      tile,

                  "forecast_hours":
                      24,

                  "forecast_interval_hours":
                      1,

                  "generated_at":
                      generated_at,

                  "attribution":
                      "Deutscher Wetterdienst (DWD)",

                  "sampling_step":
                      sampling_step,

                  "points":
                      points
              }

              with open(
                  f"tiles/{tile}.json",
                  "w",
                  encoding="utf-8"
              ) as file:

                  json.dump(
                      payload,
                      file,
                      separators=(",", ":"),
                      ensure_ascii=False
                  )

          index = {
              "status":
                  "ok",

              "source":
                  "DWD Open Data",

              "model":
                  "ICON-EU",

              "model_run":
                  RUN_ID,

              "generated_at":
                  generated_at,

              "tile_count":
                  len(
                      tile_names
                  ),

              "total_points":
                  total_points,

              "forecast_hours":
                  24,

              "forecast_interval_hours":
                  1,

              "attribution":
                  "Deutscher Wetterdienst (DWD)",

              "tiles":
                  sorted(
                      tile_names
                  )
          }

          with open(
              "icon-eu-index.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  index,
                  file,
                  separators=(",", ":"),
                  ensure_ascii=False
              )

          with open(
              "icon-eu-run.txt",
              "w",
              encoding="utf-8"
          ) as file:

              file.write(
                  RUN_ID
              )

          print(
              "ICON-EU Lauf:",
              RUN_ID
          )

          print(
              "Kacheln:",
              len(
                  tile_names
              )
          )

          print(
              "Punkte:",
              total_points
          )
          PY

      - name: ICON-EU Archiv erstellen
        if: steps.changed.outputs.new_data == 'true'
        run: |
          tar -czf \
            icon-eu-tiles.tar.gz \
            tiles

          ls -lh \
            icon-eu-tiles.tar.gz

      - name: ICON-EU zu STRATO übertragen
        if: steps.changed.outputs.new_data == 'true'
        env:
          SSHPASS: ${{ secrets.STRATO_PASSWORD }}

        run: |
          set -euo pipefail

          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            "${{ secrets.STRATO_USER }}@${{ secrets.STRATO_HOST }}" \
            "mkdir -p Orend/paraweather-data"

          sshpass -e scp \
            -o StrictHostKeyChecking=no \
            icon-eu-tiles.tar.gz \
            "${{ secrets.STRATO_USER }}@${{ secrets.STRATO_HOST }}:Orend/paraweather-data/icon-eu-tiles.tar.gz"

          sshpass -e scp \
            -o StrictHostKeyChecking=no \
            icon-eu-index.json \
            "${{ secrets.STRATO_USER }}@${{ secrets.STRATO_HOST }}:Orend/paraweather-data/icon-eu-index.json.new"

          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            "${{ secrets.STRATO_USER }}@${{ secrets.STRATO_HOST }}" \
            '
            cd Orend/paraweather-data &&
            rm -rf icon-eu-tiles-new &&
            mkdir icon-eu-tiles-new &&
            tar -xzf icon-eu-tiles.tar.gz \
              -C icon-eu-tiles-new \
              --strip-components=1 &&
            test -n "$(find icon-eu-tiles-new -type f -name "*.json" -print -quit)" &&
            rm -rf icon-eu-tiles-old &&
            if [ -d icon-eu-tiles ]; then
              mv icon-eu-tiles icon-eu-tiles-old
            fi &&
            mv icon-eu-tiles-new icon-eu-tiles &&
            mv icon-eu-index.json.new icon-eu-index.json &&
            rm -rf icon-eu-tiles-old &&
            rm -f icon-eu-tiles.tar.gz
            '

          # Der Laufmarker wird absichtlich zuletzt veröffentlicht.
          sshpass -e scp \
            -o StrictHostKeyChecking=no \
            icon-eu-run.txt \
            "${{ secrets.STRATO_USER }}@${{ secrets.STRATO_HOST }}:Orend/paraweather-data/icon-eu-run.txt.new"

          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            "${{ secrets.STRATO_USER }}@${{ secrets.STRATO_HOST }}" \
            "mv Orend/paraweather-data/icon-eu-run.txt.new Orend/paraweather-data/icon-eu-run.txt"

      - name: Kein neuer ICON-EU Lauf
        if: steps.changed.outputs.new_data == 'false'
        run: |
          echo "ICON-EU ist bereits aktuell."
          echo "Keine Daten neu verarbeitet."
