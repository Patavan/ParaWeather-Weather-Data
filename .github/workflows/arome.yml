name: ParaWeather AROME Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */3 * * *"

jobs:
  arome:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. WERKZEUGE
      # ============================================================

      - name: Werkzeuge installieren
        run: |
          set -euo pipefail

          sudo apt-get update -qq

          sudo apt-get install -y -qq \
            curl \
            jq \
            sshpass


      # ============================================================
      # 2. OFFIZIELLEN AROME-DATENSATZ LADEN
      # ============================================================

      - name: AROME 0.01 Datenkatalog laden
        run: |
          set -euo pipefail

          DATASET_URL="https://www.data.gouv.fr/api/1/datasets/paquets-arome-resolution-0-01deg/"

          echo
          echo "================================"
          echo "AROME 0.01 Datenkatalog"
          echo "================================"
          echo

          HTTP_CODE=$(
            curl \
              --silent \
              --show-error \
              --location \
              --retry 3 \
              --retry-delay 2 \
              --retry-all-errors \
              --output arome-dataset.json \
              --write-out "%{http_code}" \
              "$DATASET_URL"
          )

          echo "HTTP Status: ${HTTP_CODE}"

          if [ "$HTTP_CODE" != "200" ]; then

            echo "AROME Datenkatalog konnte nicht geladen werden."

            exit 1

          fi

          jq -e . \
            arome-dataset.json \
            >/dev/null

          RESOURCE_COUNT=$(
            jq \
              '.resources | length' \
              arome-dataset.json
          )

          echo
          echo "AROME Ressourcen:"
          echo "$RESOURCE_COUNT"

          if [ "$RESOURCE_COUNT" -lt 1 ]; then

            echo "Keine AROME Ressourcen vorhanden."

            exit 1

          fi


      # ============================================================
      # 3. AROME-GRIB-RESSOURCEN AUFLÖSEN
      # ============================================================

      - name: AROME Ressourcen analysieren
        run: |
          set -euo pipefail

          python3 <<'PY'

          import json
          import re
          import subprocess
          from collections import defaultdict


          with open(
              "arome-dataset.json",
              "r",
              encoding="utf-8"
          ) as file:

              dataset = json.load(
                  file
              )


          resources = dataset.get(
              "resources",
              []
          )


          print(
              "Ressourcen insgesamt:",
              len(resources)
          )


          pattern = re.compile(
              r"/arome/001/"
              r"(SP1|SP2|HP1)/"
              r"arome__001__"
              r"(SP1|SP2|HP1)__"
              r"(\d{2})H__"
              r"([^/]+)\.grib2"
          )


          resolved = []


          for number, resource in enumerate(
              resources,
              start=1
          ):

              url = (
                  resource.get("url")
                  or
                  resource.get("latest")
                  or
                  ""
              )


              if not url:

                  continue


              resource_format = (
                  resource.get(
                      "format",
                      ""
                  )
                  or ""
              ).lower()


              if (
                  resource_format
                  and
                  "grib" not in resource_format
              ):

                  continue


              try:

                  result = subprocess.run(
                      [
                          "curl",
                          "--silent",
                          "--show-error",
                          "--location",
                          "--head",
                          "--retry",
                          "2",
                          "--connect-timeout",
                          "15",
                          "--max-time",
                          "30",
                          "--write-out",
                          "%{url_effective}",
                          "--output",
                          "/dev/null",
                          url
                      ],
                      text=True,
                      capture_output=True,
                      check=True
                  )

                  effective_url = (
                      result.stdout.strip()
                  )

              except subprocess.CalledProcessError as error:

                  print(
                      "HEAD fehlgeschlagen:",
                      url
                  )

                  continue


              match = pattern.search(
                  effective_url
              )


              if not match:

                  continue


              directory_package = (
                  match.group(1)
              )

              filename_package = (
                  match.group(2)
              )

              forecast_hour = int(
                  match.group(3)
              )

              run = (
                  match.group(4)
              )


              if (
                  directory_package
                  != filename_package
              ):

                  continue


              resolved.append({
                  "package":
                      directory_package,

                  "forecast_hour":
                      forecast_hour,

                  "run":
                      run,

                  "resource_url":
                      url,

                  "download_url":
                      effective_url
              })


              print(
                  f"{directory_package} "
                  f"+{forecast_hour:02d}h "
                  f"{run}"
              )


          if not resolved:

              raise RuntimeError(
                  "Keine AROME-0.01-GRIB2-Ressourcen erkannt"
              )


          with open(
              "arome-resources.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  resolved,
                  file,
                  ensure_ascii=False,
                  indent=2
              )


          print()
          print(
              "Erkannte AROME-GRIB-Ressourcen:",
              len(resolved)
          )

          PY


      # ============================================================
      # 4. NEUESTEN GEMEINSAMEN AROME-LAUF BESTIMMEN
      # ============================================================

      - name: Neuesten vollständigen AROME Lauf bestimmen
        id: detect
        run: |
          set -euo pipefail

          python3 <<'PY'

          import json
          import os

          from collections import (
              defaultdict
          )


          with open(
              "arome-resources.json",
              "r",
              encoding="utf-8"
          ) as file:

              resources = json.load(
                  file
              )


          runs = defaultdict(
              lambda: defaultdict(set)
          )


          for item in resources:

              runs[
                  item["run"]
              ][
                  item["package"]
              ].add(
                  item["forecast_hour"]
              )


          required_packages = [
              "SP1",
              "SP2",
              "HP1"
          ]


          candidates = []


          for run, packages in runs.items():

              package_counts = {
                  package:
                      len(
                          packages.get(
                              package,
                              set()
                          )
                      )
                  for package
                  in required_packages
              }


              print(
                  run,
                  package_counts
              )


              #
              # Mindestens +00h muss für
              # alle drei Pakete vorhanden sein.
              #
              complete = all(
                  0 in packages.get(
                      package,
                      set()
                  )
                  for package
                  in required_packages
              )


              if complete:

                  candidates.append(
                      run
                  )


          if not candidates:

              raise RuntimeError(
                  "Kein gemeinsamer AROME Lauf "
                  "für SP1, SP2 und HP1 gefunden"
              )


          selected_run = sorted(
              candidates
          )[-1]


          print()
          print(
              "Verwendeter AROME Lauf:",
              selected_run
          )


          with open(
              os.environ[
                  "GITHUB_OUTPUT"
              ],
              "a"
          ) as output:

              output.write(
                  f"run={selected_run}\n"
              )

          PY


      # ============================================================
      # 5. AROME STATUS ERZEUGEN
      # ============================================================

      - name: AROME Status erzeugen
        run: |
          set -euo pipefail

          python3 <<'PY'

          import json

          from datetime import (
              datetime,
              timezone
          )


          RUN = (
              "${{ steps.detect.outputs.run }}"
          )


          with open(
              "arome-resources.json",
              "r",
              encoding="utf-8"
          ) as file:

              resources = json.load(
                  file
              )


          selected = [
              item
              for item in resources
              if item["run"] == RUN
          ]


          packages = {}


          for package in [
              "SP1",
              "SP2",
              "HP1"
          ]:

              hours = sorted({
                  item[
                      "forecast_hour"
                  ]
                  for item in selected
                  if item[
                      "package"
                  ] == package
              })


              packages[
                  package
              ] = {
                  "available":
                      bool(hours),

                  "forecast_hours":
                      hours,

                  "count":
                      len(hours)
              }


          status = {

              "status":
                  "ok",

              "source":
                  "Météo-France / data.gouv.fr",

              "model":
                  "AROME",

              "resolution_deg":
                  0.01,

              "grid":
                  "EURW1S100",

              "format":
                  "GRIB2",

              "model_run":
                  RUN,

              "generated_at":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "authentication_required":
                  False,

              "packages":
                  packages,

              "dataset":
                  "Paquets Arome - Résolution 0,01°",

              "attribution":
                  "Météo-France",

              "license":
                  "Licence Ouverte / Open Licence 2.0"
          }


          with open(
              "arome-status.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  status,
                  file,
                  ensure_ascii=False,
                  indent=2
              )


          print(
              json.dumps(
                  status,
                  ensure_ascii=False,
                  indent=2
              )
          )

          PY


      # ============================================================
      # 6. DOWNLOAD-MANIFEST ERZEUGEN
      # ============================================================

      - name: AROME Download-Manifest erzeugen
        run: |
          set -euo pipefail

          python3 <<'PY'

          import json


          RUN = (
              "${{ steps.detect.outputs.run }}"
          )


          with open(
              "arome-resources.json",
              "r",
              encoding="utf-8"
          ) as file:

              resources = json.load(
                  file
              )


          selected = [
              item
              for item in resources
              if item["run"] == RUN
              and
              item["package"] in (
                  "SP1",
                  "SP2",
                  "HP1"
              )
          ]


          selected.sort(
              key=lambda item: (
                  item["package"],
                  item["forecast_hour"]
              )
          )


          manifest = {

              "model":
                  "AROME",

              "resolution_deg":
                  0.01,

              "model_run":
                  RUN,

              "resources":
                  selected
          }


          with open(
              "arome-download-manifest.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  manifest,
                  file,
                  ensure_ascii=False,
                  indent=2
              )


          print(
              "Manifest-Ressourcen:",
              len(selected)
          )

          PY


      # ============================================================
      # 7. ZU STRATO ÜBERTRAGEN
      # ============================================================

      - name: AROME Metadaten zu STRATO übertragen
        env:

          SSHPASS: ${{ secrets.STRATO_PASSWORD }}

        run: |
          set -euo pipefail

          echo
          echo "================================"
          echo "AROME Upload zu STRATO"
          echo "================================"
          echo


          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            "${{ secrets.STRATO_USER }}@${{ secrets.STRATO_HOST }}" \
            "mkdir -p Orend/paraweather-data"


          sshpass -e scp \
            -o StrictHostKeyChecking=no \
            arome-status.json \
            "${{ secrets.STRATO_USER }}@${{ secrets.STRATO_HOST }}:Orend/paraweather-data/arome-status.json"


          sshpass -e scp \
            -o StrictHostKeyChecking=no \
            arome-download-manifest.json \
            "${{ secrets.STRATO_USER }}@${{ secrets.STRATO_HOST }}:Orend/paraweather-data/arome-download-manifest.json"


          echo
          echo "AROME Metadaten erfolgreich übertragen."


      # ============================================================
      # 8. ABSCHLUSS
      # ============================================================

      - name: Abschluss
        run: |
          echo
          echo "================================"
          echo "AROME erfolgreich"
          echo "================================"
          echo
          echo "AROME 0.01 Datenquelle: OK"
          echo "SP1 erkannt"
          echo "SP2 erkannt"
          echo "HP1 erkannt"
          echo "Kein Météo-France API-Token erforderlich"
          echo "Kein DPPaquetAROME"
          echo "Kein WCS GetCapabilities"
          echo
