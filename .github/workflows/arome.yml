name: ParaWeather AROME Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */3 * * *"

jobs:
  arome:
    runs-on: ubuntu-latest

    steps:
      - name: Werkzeuge installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl jq sshpass

      - name: Météo-France Access Token erzeugen
        id: token
        env:
          METEOFRANCE_BASIC_AUTH: ${{ secrets.METEOFRANCE_BASIC_AUTH }}
        run: |
          set -euo pipefail

          if [ -z "${METEOFRANCE_BASIC_AUTH:-}" ]; then
            echo "METEOFRANCE_BASIC_AUTH fehlt."
            exit 1
          fi

          RESPONSE_FILE="$(mktemp)"
          HTTP_CODE=$(curl -sS \
            --retry 3 \
            --retry-delay 2 \
            --retry-all-errors \
            -o "$RESPONSE_FILE" \
            -w "%{http_code}" \
            -X POST \
            "https://portail-api.meteofrance.fr/token" \
            -d "grant_type=client_credentials" \
            -H "Authorization: Basic ${METEOFRANCE_BASIC_AUTH}")

          echo "Token HTTP Status: ${HTTP_CODE}"

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "Météo-France Token konnte nicht erzeugt werden."
            cat "$RESPONSE_FILE" || true
            exit 1
          fi

          RESPONSE=$(cat "$RESPONSE_FILE")

          if echo "$RESPONSE" | jq -e . >/dev/null 2>&1; then
            ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token // .token // empty')
          else
            ACCESS_TOKEN=$(echo "$RESPONSE" | tr -d '\r\n"')
          fi

          if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "null" ]; then
            echo "Kein gültiger Access Token erhalten."
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN"
          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"
          echo "Météo-France Token erfolgreich erzeugt."

      - name: AROME API-Zugang prüfen
        env:
          ACCESS_TOKEN: ${{ steps.token.outputs.access_token }}
        run: |
          set -euo pipefail

          BASE="https://public-api.meteofrance.fr/previnum/DPPaquetAROME/v1"

          HTTP_CODE=$(curl -sS -L \
            --retry 3 \
            --retry-delay 2 \
            --retry-all-errors \
            -o arome-grids.json \
            -w "%{http_code}" \
            "$BASE/models/AROME/grids" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "accept: text/json")

          echo "AROME Grids HTTP Status: ${HTTP_CODE}"

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "AROME Package API nicht erreichbar."
            cat arome-grids.json || true
            echo
            echo "Bei HTTP 403 ist DPPaquetAROME im Météo-France-Konto noch nicht freigeschaltet."
            exit 1
          fi

          jq -e . arome-grids.json >/dev/null
          echo "AROME Package API erreichbar."

      - name: AROME 0.01 Raster erkennen
        id: grid
        run: |
          set -euo pipefail

          GRID=$(jq -r '
            [
              .links[]?
              | select(
                  ((.title // "") | ascii_downcase | contains("0,01"))
                  or ((.title // "") | ascii_downcase | contains("0.01"))
                  or ((.href // "") | contains("/0.01"))
                )
              | (.href // "" | split("/")[-1])
            ][0] // empty
          ' arome-grids.json)

          if [ -z "$GRID" ]; then
            echo "AROME 0.01 Raster nicht automatisch erkannt."
            jq -r '.links[]? | "- \(.title // "?") -> \(.href // "?")"' arome-grids.json
            exit 1
          fi

          echo "Erkanntes AROME Raster: $GRID"
          echo "grid=$GRID" >> "$GITHUB_OUTPUT"

      - name: AROME Pakete laden
        env:
          ACCESS_TOKEN: ${{ steps.token.outputs.access_token }}
        run: |
          set -euo pipefail

          GRID="${{ steps.grid.outputs.grid }}"
          URL="https://public-api.meteofrance.fr/previnum/DPPaquetAROME/v1/models/AROME/grids/${GRID}/packages"

          HTTP_CODE=$(curl -sS -L \
            --retry 3 \
            --retry-delay 2 \
            --retry-all-errors \
            -o arome-packages.json \
            -w "%{http_code}" \
            "$URL" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "accept: text/json")

          echo "AROME Packages HTTP Status: ${HTTP_CODE}"

          if [ "${HTTP_CODE}" != "200" ]; then
            cat arome-packages.json || true
            exit 1
          fi

          jq -e . arome-packages.json >/dev/null
          echo "AROME Paketkatalog erfolgreich geladen."

      - name: AROME Oberflächenpaket analysieren
        id: surface
        env:
          ACCESS_TOKEN: ${{ steps.token.outputs.access_token }}
        run: |
          set -euo pipefail

          GRID="${{ steps.grid.outputs.grid }}"
          BASE="https://public-api.meteofrance.fr/previnum/DPPaquetAROME/v1/models/AROME/grids/${GRID}/packages"

          PACKAGE=$(jq -r '
            [
              .links[]?
              | select(
                  ((.title // "") | ascii_downcase | contains("surface"))
                  or ((.href // "") | endswith("/SP1"))
                )
              | (.href // "" | split("/")[-1])
            ][0] // empty
          ' arome-packages.json)

          if [ -z "$PACKAGE" ]; then
            echo "Kein AROME-Oberflächenpaket automatisch erkannt."
            jq -r '.links[]? | "- \(.title // "?") -> \(.href // "?")"' arome-packages.json
            exit 1
          fi

          echo "Verwendetes Paket: $PACKAGE"

          HTTP_CODE=$(curl -sS -L \
            --retry 3 \
            --retry-delay 2 \
            --retry-all-errors \
            -o arome-surface-package.json \
            -w "%{http_code}" \
            "$BASE/$PACKAGE" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "accept: text/json")

          echo "Surface Package HTTP Status: ${HTTP_CODE}"

          if [ "${HTTP_CODE}" != "200" ]; then
            cat arome-surface-package.json || true
            exit 1
          fi

          jq -e . arome-surface-package.json >/dev/null
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"

      - name: AROME Status erzeugen
        run: |
          python3 <<'PY'
          import json
          import re
          from datetime import datetime, timezone

          with open("arome-surface-package.json", "r", encoding="utf-8") as f:
              surface = json.load(f)

          description = surface.get("description", "")
          upper = description.upper()

          checks = {
              "temperature_2m": "T(2M)" in upper or "TEMPERATURE" in upper,
              "wind_u_10m": "U(10M)" in upper or "U (10M)" in upper,
              "wind_v_10m": "V(10M)" in upper or "V (10M)" in upper,
              "gust_10m": "RAF" in upper or "GUST" in upper,
              "precipitation": "PRECIP" in upper,
              "cloud": "NEBUL" in upper or "CLOUD" in upper,
              "pressure_msl": "P(MER)" in upper or "P (MER)" in upper or "MSL" in upper,
          }

          reference_times = []
          for link in surface.get("links", []):
              href = link.get("href", "")
              m = re.search(r"referencetime=([^&]+)", href)
              if m:
                  value = m.group(1)
                  if value not in reference_times:
                      reference_times.append(value)

          status = {
              "status": "ok",
              "source": "Météo-France Open Data API",
              "model": "AROME",
              "grid": "${{ steps.grid.outputs.grid }}",
              "api": "DPPaquetAROME v1",
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "parameters_detected": checks,
              "ready_for_data_download": all(checks.values()),
              "reference_times": reference_times[:20],
              "surface_package_description": description,
          }

          with open("arome-status.json", "w", encoding="utf-8") as f:
              json.dump(status, f, ensure_ascii=False, indent=2)

          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY

      - name: AROME Metadaten zu STRATO übertragen
        env:
          SSHPASS: ${{ secrets.STRATO_PASSWORD }}
        run: |
          set -euo pipefail

          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            "${{ secrets.STRATO_USER }}@${{ secrets.STRATO_HOST }}" \
            "mkdir -p Orend/paraweather-data"

          for FILE in \
            arome-grids.json \
            arome-packages.json \
            arome-surface-package.json \
            arome-status.json
          do
            sshpass -e scp \
              -o StrictHostKeyChecking=no \
              "$FILE" \
              "${{ secrets.STRATO_USER }}@${{ secrets.STRATO_HOST }}:Orend/paraweather-data/$FILE"
          done

      - name: Abschluss
        run: |
          echo "Météo-France Authentifizierung erfolgreich."
          echo "AROME Package API ausgewertet."
          echo "AROME Metadaten zu STRATO übertragen."
